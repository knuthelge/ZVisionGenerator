    summary: "Non-commercial: ViTMatte was trained on Adobe's Deep Image Matting dataset, whose agreement allows models trained on it only for non-commercial use, and BiRefNet (MIT) partly on DIS5K, which is research-only"
    url_label: "Dataset terms"
    url: "https://github.com/xuebinqin/DIS/blob/e6455bae3892b3a7d8cf59ca91011a220d1ed606/DIS5K-Dataset-Terms-of-Use.pdf"

# image_families: what each image model family can do, keyed by family; the family's values apply to every variant, and a key
# set under variants.<variant> overrides them. Keys left out take model_capabilities' permissive defaults. Defaults (steps,
# guidance, scheduler, upscale) are settings and live in config.yaml under model_presets.
image_families:
  zimage:
    supports_negative_prompt: true

  flux2_klein:
    supports_negative_prompt: false
    max_reference_images: 4  # BFL documents up to 4; neither library enforces a count

  flux2:
    supports_negative_prompt: false

  flux1:
    supports_negative_prompt: false
    enhance_max_words: 180  # FLUX.1-schnell reads only 256 T5 tokens

  ideogram4:
    supports_negative_prompt: false
    supports_scheduler: false  # Instant runs its own noise schedule
    supports_img2img: false
    supports_upscale: false
    supports_json_prompt: true
    supports_first_sigma: true
    dimension_min: 256
    dimension_max: 2048
    dimension_step: 16

  krea2:
    # Guidance is the standard CFG scale on both backends (1.0 = off); the diffusers
    # backend converts it to Krea 2's own scale, where 0.0 = off.
    supports_negative_prompt: false

  moss:
    # Turbo and SFT are variants of one family, picked from the model folder. A variant may also set capability flags.
    supports_negative_prompt: true
    supports_scheduler: false  # MOSS samples with its own schedule (Euler, shift 5)
    variants:
      turbo:
        supports_negative_prompt: false
        negative_prompt_hint: Use -m moss-sft for negative prompts.

  unknown:
    supports_negative_prompt: false

# video_families: what each video family can do, keyed by family. versions.<id> is overlaid on the family block for the models
# that name it as their version (dicts merge, every other value, an empty list included, replaces). companions are the
# downloads every model of the family shares, per platform; a model's own downloads come first. A converter_base names the
# model whose MLX pack a converted checkpoint takes its VAEs, vocoder, upsampler and configs from, per quantize level.
# The step defaults, the upscale steps and ffn_chunk_tokens are settings and live in config.yaml under video_model_presets.
video_families:
  ltx:
    label: "LTX distilled model"
    max_steps: 8
    # Valid frame counts are alignment * k + offset (8k+1: 9, 17, ... 121); another count moves to the nearest one.
    frame_rule: { alignment: 8, offset: 1, round: nearest }
    # An extension adds frames in multiples of this.
    extend_frame_step: 8
    # The frames of the source's end an extension carries into its window (4 latent frames); the window is these plus the new frames.
    carry_frames: 25
    capabilities: { i2v: true, end_frame: true, extend: true, upscale: true, upscale_review: true, lora: true, audio: true, low_memory: true, audio_track: true, audio_track_upscale: true }
    # Lightricks' distilled LoRA: `ziv model model --model-type ltx-2.3 --distill` merges it into a plain-dev
    # checkpoint, which otherwise renders broken at the 8 steps the app runs LTX at.
    distilled_lora:
      ref: "Lightricks/LTX-2.3@c1521179de480464f366a98a9d9b2acc4cc097b9"
      file: "ltx-2.3-22b-distilled-lora-384-1.1.safetensors"
      licence: ltx-2-community  # the licence record (above) named before the download
    # macOS: the model whose pinned MLX pack a converted checkpoint takes its VAEs, vocoder, upsampler and configs from, per quantize level.
    converter_base: { q4: ltx-4, q8: ltx-8 }
    companions:
      # macOS: the Gemma 3 text encoder the LTX-2.3 packs encode prompts with, pinned; LTX-2.5 packs bundle their own.
      darwin:
        - { ref: "mlx-community/gemma-3-12b-it-4bit@86cc6a8dedbc456dd0e4af01a9d09f396f77e558", files_from: loader, role: text_encoder }
      # Windows/Linux: the distilled transformer, one single-file LTX-2 checkpoint in a Hugging Face repo (1.1 matches macOS), and
      # the 2x spatial latent upsampler for --upscale 2. Every LTX-2.3 source is pinned: Lightricks deletes and moves files in its repo.
      win32: &ltx23_cuda_companions
        - { ref: "Lightricks/LTX-2.3@c1521179de480464f366a98a9d9b2acc4cc097b9", files: [ltx-2.3-22b-distilled-1.1.safetensors], role: transformer }
        - { ref: "Lightricks/LTX-2.3@c1521179de480464f366a98a9d9b2acc4cc097b9", files: [ltx-2.3-spatial-upscaler-x2-1.1.safetensors], role: latent_upsampler }
      linux: *ltx23_cuda_companions
    # Per-version overlays: a version's block is merged over this family block for the models that name it
    # (CLI flags > version > family > global). The family block above is LTX-2.3.
    versions:
      ltx25:
        # `ziv model model --model-type ltx-2.5` converts into this version.
        model_type: ltx-2.5
        # Lightricks' LTX-2.5 distilled LoRA for --distill: an ungated copy whose size and SHA-256
        # (86370bbf79a9eb4edaa158907e2b48a5188fe4c5dc8ce30c7eb8f2f131a9bbf5, 8,899,889,568 bytes) equal the gated
        # original's, Lightricks/LTX-2.5 loras/ltx-2.5-22b-distilled-lora-450-bf16.safetensors; pinned.
        distilled_lora:
          ref: "lxxxy6/LTX-2.5@3506f52caf688795fc35edbf0d1b197bc30f3df1"
          file: "ltx-2.5-22b-distilled-lora-450-bf16.safetensors"
          licence: ltx-2x-community
        # macOS: the ltx25-4 pack has only q4, and its quantize_config.json is linked at both levels: the MLX loader reads the
        # bits from the weights' shapes.
        converter_base: { q4: ltx25-4, q8: ltx25-4 }
        image_crf: 18 # i2v conditioning image, re-compressed before the fit
        sampler: euler_ancestral # upstream distilled sampler; step noise from seed + 10000 / + 20000
        companions:
          darwin: [] # the packs bundle their Gemma 4 encoder
          # The repo's own transformer folder is used; only the latent upsampler lives in a file of its own.
          win32: &ltx25_cuda_companions
            - { ref: "unsloth/LTX-2.5-FP8@7b40724fc39bbb01d9b4d72638c0d263531c88c2", files: [latent_upsampler/diffusion_pytorch_model.safetensors], role: latent_upsampler }
          linux: *ltx25_cuda_companions

  # MiniMax H3: 17-frame blocks, distilled to 4 or 8 steps by the turbo LoRA below. Valid frame counts are 17k+5 (22, 39,
  # ... 124 is 5 s); a count between two moves up to the next one, and there is no length cap.
  h3:
    label: "MiniMax H3"
    max_steps: 8
    step_options: [4, 8] # both run from the one stored copy (it holds the fold tables of both schedules)
    frame_rule: { alignment: 17, offset: 5, round: up }
    extend_frame_step: 17
    extend_fps: 24 # an Extend source must run at 24 fps
    carry_frames: 22 # 17 * 1 + 5, the smallest valid clip
    platform_carry_frames: { darwin: 1 } # macOS renders an image-to-video clip from the source's last frame, so one frame is carried
    capabilities: { i2v: true, end_frame: true, extend: true, upscale: true, upscale_review: true, lora: true, audio: true, low_memory: false, audio_track: true, audio_track_upscale: false }
    platform_capabilities:
      darwin: { upscale: false, upscale_review: false }
    schedules: # Windows/Linux
      8: { forwards: 8, video_shift: 6.0, audio_shift: 3.0 }
      4: { forwards: 4, video_shift: 6.0, audio_shift: 3.0 }
    text_encoder_layers: 50 # the 50 layers of the Qwen3-VL text encoder the model reads
    lora_scale: 0.0625 # the turbo LoRA's scale replaces alpha/rank and is never multiplied by it
    # macOS: the text encoder is converted once to this 4-bit form and kept next to the model as <name>@mlx-te4.
    mlx_text_encoder: { bits: 4, group_size: 64, layers: 50 }
    companions:
      darwin:
        # The 8-step turbo LoRA; the INT8 transformer applies it unfused at run time.
        - &h3_lora { ref: "lightx2v/Minimax-h3-Turbo@30f485ed874aa44c8183348ad361c5eabad318da", files: [minimax_h3_fl2v_turbo_8step_v1.0_768p_bf16.safetensors], role: lora }
      # Windows/Linux, in this order: the text encoder, the turbo LoRA (merged into the stored copy) and the latent upscaler.
      win32: &h3_cuda_companions
        # Qwen3-VL 32B Instruct, NF4: the first four of five weight shards hold the 50 layers the model reads.
        - { ref: "unsloth/Qwen3-VL-32B-Instruct-bnb-4bit@48cfc6496841742a77892646c15a7f3e8da44348", files: [config.json, model.safetensors.index.json, model-00001-of-00005.safetensors, model-00002-of-00005.safetensors, model-00003-of-00005.safetensors, model-00004-of-00005.safetensors], role: text_encoder }
        - *h3_lora
        # The 3D latent upscaler of the H3 upscale: a 2x enlargement of the stage-1 latents before a short full-size refinement.
        # sha256 043e5a48e161610ef6c3ea974645220354d06fa618abca15f76d084812eb55c2, 690,592,672 bytes, Apache-2.0, ungated.
        # Run in fp16. There is no runtime hash check: the revision pin fixes the file and the strict load rejects a wrong one.
        # The file is in a subfolder of the repository.
        - { ref: "LBH-123-AI/Minimax_h3_latent_Upscaler@3f941d5d182014dd5c0a5e16330420ee2d4aa0c6", files: [minimax_h3_latent_upscaler_3d_conv_v1/minimax_h3_latent_upscaler_3d_conv_v1_fp16.safetensors], role: latent_upsampler }
      linux: *h3_cuda_companions

models:
  # On Windows/Linux both LTX aliases load the diffusers repo, at the quantize level of their own entry; the stored copy of each
  # is ~/.ziv/models/<alias>@q<bits>.
  # On macOS the LTX aliases load the pinned MLX packs, so an alias, the download plan and the Models page read one revision and
  # one file list. A pack is downloaded as exactly its listed files, at its pinned revision. After changing a pin, list the files
  # of the new revision that the vendored loader reads: the pack repos hold files the app never loads (other transformers,
  # LoRAs, other upsamplers).
  ltx-8:
    kind: video
    family: ltx
    name: "LTX-2.3 8-bit"
    quantize: 8 # 8 = FP8 transformer; with an FP8 text encoder and connectors
    licences: [ltx-2-community, gemma]
    downloads:
      darwin:
        - { ref: "dgrauet/ltx-2.3-mlx-q8@6671a7572a530862d1d60ce393b5d93491e3f76b", files: &ltx23_mlx_files [transformer-distilled-1.1.safetensors, connector.safetensors, vae_encoder.safetensors, vae_decoder.safetensors, audio_vae.safetensors, vocoder.safetensors, spatial_upscaler_x2_v1_1.safetensors, spatial_upscaler_x2_v1_1_config.json, embedded_config.json, config.json] }
      # Distilled LTX 2.3 in diffusers format (8 steps, guidance 1.0), pinned. Distilled checkpoints only. Its text encoder,
      # connectors, VAEs and vocoder are used; the transformer comes from the family's single-file companion.
      win32: &ltx23_cuda
        - { ref: "diffusers/LTX-2.3-Distilled-Diffusers@432e0d3c2d1769aaa4d295f9243f7062bf6b47ee", ignore: ["transformer/*.safetensors", "transformer/*.safetensors.index.json"] }
      linux: *ltx23_cuda
  ltx-4:
    kind: video
    family: ltx
    name: "LTX-2.3 4-bit"
    quantize: 4 # 4 = NF4 transformer; with an FP8 text encoder and connectors
    licences: [ltx-2-community, gemma]
    downloads:
      darwin:
        - { ref: "dgrauet/ltx-2.3-mlx-q4@56a5866d638ecfe37c54d348e88938235185c2d4", files: *ltx23_mlx_files }
      win32: *ltx23_cuda
      linux: *ltx23_cuda
  # LTX-2.5 (video_families.ltx.versions.ltx25). Windows/Linux load the diffusers repo (an ungated, byte-identical copy of
  # Lightricks/LTX-2.5-Diffusers, bf16 despite its name, pinned); macOS loads the MLX distilled files from
  # MarceloFSO/ltx-2.5-mlx-q4-fast, an ungated mirror of dgrauet/ltx-2.5-mlx-q4, distilled files only, sha256-identical; pinned.
  ltx25-4:
    kind: video
    family: ltx
    version: ltx25
    name: "LTX-2.5 4-bit"
    quantize: 4
    licences: [ltx-2x-community]
    downloads:
      darwin:
        - { ref: "MarceloFSO/ltx-2.5-mlx-q4-fast@281bf05bd23207d6feef708fc2e270f84ba992b5", files: [transformer-distilled.safetensors, text_encoder.safetensors, text_encoder_config.json, tokenizer.json, tokenizer_config.json, chat_template.jinja, connector.safetensors, vae_decoder_conv.safetensors, vae_encoder_conv.safetensors, audio_vae.safetensors, vocoder.safetensors, spatial_upscaler_x2_v1_0.safetensors, spatial_upscaler_x2_v1_0_config.json, duration_head.safetensors, embedded_config.json, quantize_config.json] }
      win32: &ltx25_cuda
        - { ref: "unsloth/LTX-2.5-FP8@7b40724fc39bbb01d9b4d72638c0d263531c88c2", ignore: ["LTX-2.5-*.safetensors", "samples/*"] } # the root single-file checkpoints (69 GB) and samples
      linux: *ltx25_cuda
  # MiniMax H3: the same pinned repository on every platform. Windows/Linux stream it from a stored 4-bit copy; macOS runs the
  # MLX port from the INT8 transformer.
  h3:
    kind: video
    family: h3
    name: "MiniMax H3"
    licences: [minimax-h3-community]
    downloads:
      # macOS lists every file, so a download is checked file by file. In this order: the INT8 transformer (Argus-calibrated),
      # then the FL2VA parts of the repo the pipeline loads (tokenizer, processor, both VAEs and shards 1-11 and 14 of the text
      # encoder), then the family's LoRA companion.
      darwin:
        - ref: "water1234/MiniMax-H3-MLX-Argus-Calibrated-INT8@70505b09c80e298e684d798d8e0f946937dcfad4"
          files: [config.json, quant_config.json, model.safetensors.index.json, model-00001-of-00008.safetensors, model-00002-of-00008.safetensors, model-00003-of-00008.safetensors, model-00004-of-00008.safetensors, model-00005-of-00008.safetensors, model-00006-of-00008.safetensors, model-00007-of-00008.safetensors, model-00008-of-00008.safetensors]
          role: transformer
        - ref: "MiniMaxAI/MiniMax-H3@42ed227ee7df40d41602854ae760620d6eb651fe"
          files:
          - "FL2VA/model_index.json"
          - "FL2VA/tokenizer/merges.txt"
          - "FL2VA/tokenizer/tokenizer.json"
          - "FL2VA/tokenizer/tokenizer_config.json"
          - "FL2VA/tokenizer/vocab.json"
          - "FL2VA/processor/chat_template.json"
          - "FL2VA/processor/merges.txt"
          - "FL2VA/processor/preprocessor_config.json"
          - "FL2VA/processor/tokenizer.json"
          - "FL2VA/processor/tokenizer_config.json"
          - "FL2VA/processor/video_preprocessor_config.json"
          - "FL2VA/processor/vocab.json"
          - "FL2VA/video_vae/config.json"
          - "FL2VA/video_vae/source/config.json"
          - "FL2VA/video_vae/source/model.safetensors"
          - "FL2VA/audio_vae/config.json"
          - "FL2VA/audio_vae/config.yaml"
          - "FL2VA/audio_vae/metadata.json"
          - "FL2VA/audio_vae/model.safetensors"
          - "FL2VA/text_encoder/config.json"
          - "FL2VA/text_encoder/model.safetensors.index.json"
          - "FL2VA/text_encoder/model-00001-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00002-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00003-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00004-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00005-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00006-of-00014.safetensors"
