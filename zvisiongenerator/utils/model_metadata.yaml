  ltx-4: {kind: video, licences: [ltx-2-community, gemma]}
  ltx25-4: {kind: video, licences: [ltx-2x-community]}
  h3: {kind: video, licences: [minimax-h3-community]}
  zit: {kind: image, licences: [zimage-apache]}
  klein9b: {kind: image, licences: [flux-nc]}
  klein4b: {kind: image, licences: [flux-klein-apache]}
  krea2: {kind: image, licences: [krea-2-community]}
  ideo: {kind: image, licences: [ideogram-4-nc]}
  moss: {kind: image, licences: [moss-apache]}
  moss-sft: {kind: image, licences: [moss-apache]}
  yue2: {kind: audio, licences: [yue2-creator-nc]}
  qwen3_tts: {kind: audio, licences: [qwen3-tts-apache]}
  sa3: {kind: audio, licences: [stability-community, gemma]}
  enhancer-fast: {kind: enhancer, licences: [qwen-apache]}
  enhancer-smart: {kind: enhancer, licences: [qwen-apache]}
  seedvr2-7b: {kind: upscaler, licences: [seedvr2-apache]}
  seedvr2-3b: {kind: upscaler, licences: [seedvr2-apache]}
  matte: {kind: matte, licences: [matte]}
