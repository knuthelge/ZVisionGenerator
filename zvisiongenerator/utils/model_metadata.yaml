    summary: "Free under $1M revenue, images included; you must filter harmful content"
    url: "https://cdn.jsdelivr.net/gh/krea-ai/krea-2@db3984fbc6e13b34c0064990fc2d95ac64d00058/assets/hf_samples/LICENSE.pdf"
  ideogram-4-nc:
    name: "Ideogram Non-Commercial Model Agreement"
    supplier: "Ideogram"
    summary: "Non-commercial, images included: no ads, client work or paid products"
    url_label: "Model page"
    url: "https://huggingface.co/ideogram-ai/ideogram-4-fp8"
  ltx-2-community:
    name: "LTX-2 Community License Agreement"
    supplier: "Lightricks"
    summary: "Free under $10M revenue"
    url: "https://github.com/Lightricks/LTX-2/blob/a95ab856bf29407b6b066ede0abe1846050db56c/LICENSE-2"
  ltx-2x-community:
