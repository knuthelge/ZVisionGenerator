  qwen3-tts-apache:
    name: "Apache License 2.0"
    supplier: "Qwen"
    summary: "Free to use, also commercially"
    url: "https://github.com/QwenLM/Qwen3-TTS/blob/022e286b98fbec7e1e916cb940cdf532cd9f488e/LICENSE"
  seedvr2-apache:
