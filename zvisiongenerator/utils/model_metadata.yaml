  # Ideogram 4 Instant, fal's 8-step distilled Ideogram 4 (one transformer, guidance built in), under Ideogram's
  # non-commercial license. fal's own repo (fal/ideogram-v4-instant) is gated, so the transformer comes from an ungated
  # single-file repackage whose tensors were checked against fal's; the text encoder, VAE, tokenizer and scheduler come
  # from Unsloth's ungated mirrors of the base model, checked byte for byte against the official repos. Every source is
  # pinned to the checked revision; changing a pin rebuilds the folder. The models-folder entry of the same name is built on
  # first use from these targets.
  ideo:
    kind: image
    family: ideogram4 # lets the Web UI surface the alias offline (no network round-trip through detect_image_model)
    build: ideogram4_instant
    name: "Ideogram 4 Instant"
    download_size: { darwin: 28 GB, win32: 24 GB, linux: 24 GB }
    # fp8: the base FP8 repo's layout, which mflux loads. bf16: diffusers' layout, quantized by the stored-quant flow.
    transformer_format: { darwin: fp8, win32: bf16, linux: bf16 }
    licences: [ideogram-4-nc]
    downloads:
      # The components are the files of the base repo the build downloads (the transformer comes from the single-file checkpoint).
      darwin:
        - { ref: "unsloth/ideogram-4-fp8@518e05e745736960acb56d8726138ffbc174f0a9", files: &ideo_components_files [model_index.json, transformer/config.json, LICENSE.md, NOTICE, "scheduler/*", "text_encoder/*", "tokenizer/*", "vae/*"], role: components }
        - &ideo_transformer { ref: "Hippotes/Ideogram4-Fal-ComfyUI@9fcb42ce3f82267f61123755d4b65227c2e53a69", files: [Ideogram4-instant_bf16.safetensors], role: transformer }
      win32: &ideo_cuda
        - { ref: "unsloth/ideogram-4-nf4-diffusers@cb5b5dda5e0406c04160f3555c48256ec0cfc899", files: *ideo_components_files, role: components }
        - *ideo_transformer
      linux: *ideo_cuda
  # MOSS-Image (OpenMOSS-Team), a text-to-image model with a 5B transformer and a Qwen3.5-based text encoder of about
  # 8B. The SFT checkpoint and a community 4-step Turbo LoRA are downloaded once and linked into the moss and moss-sft
  # model folders. Every source is pinned; changing a pin rebuilds the affected folder. The sft target must name the same
  # revision as MOSS_REVISION in the Makefile (the vendored pipeline's revision). A new Turbo LoRA also means a new
  # variants.turbo.default_steps under model_presets.moss in config.yaml.
  # moss is Turbo (the SFT model with a 4-step LoRA); moss-sft is the SFT model as released. The SFT repo's pipeline script
  # is never fetched or run.
  moss:
    kind: image
    build: moss
    name: "MOSS-Image Turbo"
    download_size: 28 GB
    licences: [moss-apache]
    downloads:
      - &moss_sft { ref: "OpenMOSS-Team/MOSS-Image-SFT@f972bd4b4b9e3852133cc5da954d87bc32cd8fb9", files: [model_index.json, LICENSE, "transformer/*", "text_encoder/*", "tokenizer/*", "scheduler/*", "vae/*"], ignore: ["*.py"], role: sft }
      - { ref: "akhaliq/MOSS-Image-SFT-4-steps@2ded95c37a029360245926fe72e475e30039bbfb", files: [moss_image_sft_4step_v2.0.safetensors], role: turbo_lora }
  moss-sft:
    kind: image
    build: moss
    name: "MOSS-Image SFT"
    download_size: 27 GB
    licences: [moss-apache]
    downloads: [*moss_sft]

  # --- Audio models ---
  # Audio models (music, speech, sound), keyed by model id. Each has a name, its kinds (a list of music | speech | sound, the
  # first the default), the backend family, the pinned files to download (the order of the targets is load-bearing: the audio
  # loaders unpack them by position), limits and settings (settings live in config.yaml under audio_model_presets). A model
  # that sings sets lyrics: true; a speech model may list built-in voices, and the role: voice targets that following a recording
  # needs on top of its other targets. A platforms entry (cuda | mps) may name its own family and records the GPU memory peak
  # measured on it (memory_gb; leave it out while unmeasured).
  yue2:
    kind: audio
    family: yue2
    name: "YuE2 3B"
    kinds: [music]
    lyrics: true
    limits: { max_seconds: 360 }
    platforms:
      cuda: { memory_gb: 6.7 }
      mps: { memory_gb: 10.5 }
    licences: [yue2-creator-nc]
    downloads:
      - { ref: "m-a-p/YuE2-3B@8f24312f187763b9854adeec87e437e2b03bbff1", files: [config.json, generation_config.json, yue2_generation_config.json, model.safetensors, modeling_yue2.py, qwen.tiktoken, weights_manifest.json] }
      - { ref: "m-a-p/YuE2-Vae@152733a19ad43aa67e367f9b5503ef8075bb5126", files: [config.json, model.safetensors, modeling_vae.py, weights_manifest.json] }
  qwen3_tts:
    kind: audio
    family: qwen3_tts
    name: "Qwen3-TTS 1.7B"
    kinds: [speech]
    # The built-in voices, the first one the default; the label and the native language are the model card's.
    voices:
      - { id: ryan, label: Ryan, language: English }
      - { id: aiden, label: Aiden, language: English }
      - { id: vivian, label: Vivian, language: Chinese }
      - { id: serena, label: Serena, language: Chinese }
      - { id: uncle_fu, label: Uncle Fu, language: Chinese }
      - { id: dylan, label: Dylan, language: Beijing Chinese }
      - { id: eric, label: Eric, language: Sichuan Chinese }
      - { id: ono_anna, label: Ono Anna, language: Japanese }
      - { id: sohee, label: Sohee, language: Korean }
    limits: { max_new_tokens: 1200, part_chars: 500, max_text_chars: 10000, min_voice_seconds: 3, max_voice_seconds: 30 }
    platforms:
      cuda: { memory_gb: 6.0 }
      # On macOS mlx-audio runs the same official checkpoints (it converts the PyTorch convolution layouts while loading), so the
      # targets below are used as they are.
      mps: { family: qwen3_tts_mlx, memory_gb: 12.0 }
    licences: [qwen3-tts-apache]
    downloads:
      # CustomVoice: the built-in voices. It downloads with the model.
      - { ref: "Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice@0c0e3051f131929182e2c023b9537f8b1c68adfe", files: &qwen3_files [config.json, generation_config.json, merges.txt, model.safetensors, preprocessor_config.json, tokenizer_config.json, vocab.json, speech_tokenizer/config.json, speech_tokenizer/configuration.json, speech_tokenizer/model.safetensors, speech_tokenizer/preprocessor_config.json] }
      # Base: cloning a voice recording. It downloads the first time a take follows a recording.
      - { ref: "Qwen/Qwen3-TTS-12Hz-1.7B-Base@fd4b254389122332181a7c3db7f27e918eec64e3", files: *qwen3_files, role: voice }
      # VoiceDesign: a new voice from a description. It downloads the first time a voice is designed; it peaks at about 4.6 GiB on CUDA, under memory_gb.
      - { ref: "Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign@5ecdb67327fd37bb2e042aab12ff7391903235d3", files: *qwen3_files, role: design }
  sa3:
    kind: audio
    family: stable_audio_3
    name: "Stable Audio 3 Medium"
    kinds: [sound, music]
    limits: { max_seconds: 380 }
    platforms:
      cuda: { memory_gb: 6.1 }
      mps: { memory_gb: 6.1 }
    licences: [stability-community, gemma]
    downloads:
      - { ref: "Comfy-Org/stable-audio-3@75aad8836271cb5a5123fb58304fae5d3bb4b0f9", files: [checkpoints/stable_audio_3_medium.safetensors] }
      - { ref: "cocktailpeanut/stable-audio-3-medium@a30034d70bd58f6e6f967ef28ecaa6c52c185d6c", files: [model_config.json] }
      - { ref: "mlx-community/stable-audio-3-small-sfx@ca6c38718d27cd2b446a4661c8851f1f3d0a3870", files: [t5gemma-b-b-ul2/config.json, t5gemma-b-b-ul2/generation_config.json, t5gemma-b-b-ul2/model.safetensors, t5gemma-b-b-ul2/special_tokens_map.json, t5gemma-b-b-ul2/tokenizer.json, t5gemma-b-b-ul2/tokenizer_config.json] }

