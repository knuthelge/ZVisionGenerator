  # --- SeedVR2 upscale tiers (quality order; the order of the entries is the order of the tiers) ---
  # download_size is the one-time download of the weights of a platform, in decimal gigabytes (from the repository's file tree).
  # memory: estimate = weights_gb + max(activation_floor_gb, activation_base_gb + activation_gb_per_mp * MP).
  # macOS: 8-bit; the first tier within this Mac's memory budget at reference_megapixels is used. The 16-bit files are
  # downloaded and quantized to a stored 8-bit copy while loading.
  # Windows/Linux: FP8 streamed from system memory; the first tier whose system_gb fits this machine is used. weights_gb is the
  # CUDA context, the parts kept on the GPU and ~0.7 GB other apps use; system_gb is the peak system memory plus 3 GB for
  # everything else. The 7B file is numz's companion AInVFX build whose last block stays in FP16, which avoids the plain FP8
  # file's streaks in flat areas. The files are positional: the transformer, then the VAE. Unpinned, as ever.
  seedvr2-7b:
    kind: upscaler
    name: "SeedVR2 7B"
    download_size: { darwin: 17.0 GB, win32: 9.0 GB, linux: 9.0 GB }
    licences: [seedvr2-apache]
    memory:
      darwin: { weights_gb: 9.26, activation_floor_gb: 10.79, activation_base_gb: 1.88, activation_gb_per_mp: 0.83 }
      win32: &seedvr2_7b_cuda_memory { weights_gb: 1.6, activation_floor_gb: 5.0, activation_base_gb: 0.21, activation_gb_per_mp: 0.556, system_gb: 22 }
      linux: *seedvr2_7b_cuda_memory
    downloads:
      darwin:
        - { ref: "numz/SeedVR2_comfyUI", files: [seedvr2_ema_7b_fp16.safetensors, ema_vae_fp16.safetensors] }
      win32: &seedvr2_7b_cuda
        - { ref: "AInVFX/SeedVR2_comfyUI", files: [seedvr2_ema_7b_fp8_e4m3fn_mixed_block35_fp16.safetensors] }
        - { ref: "numz/SeedVR2_comfyUI", files: [ema_vae_fp16.safetensors] }
      linux: *seedvr2_7b_cuda
  seedvr2-3b:
    kind: upscaler
    name: "SeedVR2 3B"
    download_size: { darwin: 7.3 GB, win32: 3.9 GB, linux: 3.9 GB }
    licences: [seedvr2-apache]
    memory:
      darwin: { weights_gb: 4.72, activation_floor_gb: 10.79, activation_base_gb: 1.10, activation_gb_per_mp: 0.89 }
      win32: &seedvr2_3b_cuda_memory { weights_gb: 1.6, activation_floor_gb: 5.0, activation_base_gb: 0.25, activation_gb_per_mp: 0.6, system_gb: 12.5 }
      linux: *seedvr2_3b_cuda_memory
    downloads:
      darwin:
        - { ref: "numz/SeedVR2_comfyUI", files: [seedvr2_ema_3b_fp16.safetensors, ema_vae_fp16.safetensors] }
      win32: &seedvr2_3b_cuda
        - { ref: "numz/SeedVR2_comfyUI", files: [seedvr2_ema_3b_fp8_e4m3fn.safetensors] }
        - { ref: "numz/SeedVR2_comfyUI", files: [ema_vae_fp16.safetensors] }
      linux: *seedvr2_3b_cuda

  # --- Background removal ---
  # The two Hub repositories the background removal chain loads: BiRefNet for the mask and ViTMatte for the edge. The BiRefNet
  # revision is also the revision of the vendored model code in packages/birefnet (BIREFNET_REVISION in the Makefile), so the
  # weights are the ones the code was written for. The ViTMatte revision is pinned on its own. download_size is the one-time
  # download of both repos, read from a dry-run plan against an empty cache (444.5 MB + 103.3 MB).
  matte:
    kind: matte
    name: "Background removal"
    download_size: 548 MB
    licences: [matte]
    downloads:
      - { ref: "ZhengPeng7/BiRefNet@e2bf8e4460fc8fa32bba5ea4d94b3233d367b0e4", files: [model.safetensors], role: birefnet }
      - { ref: "hustvl/vitmatte-small-composition-1k@6a58ad7646403c1df626fbd746900aec7361ea1d", files: [config.json, model.safetensors, preprocessor_config.json], role: vitmatte }
