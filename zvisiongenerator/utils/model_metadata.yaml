# Facts about the built-in models: what each is, the terms it comes with and the files it downloads. Read by
# utils/model_metadata.py (and, through it, utils/licences.py and downloads/declaration.py); never merged with the user's
# config.yaml, so a user file cannot change it. Changing a pin rebuilds what is built from it (MOSS-Image, Ideogram 4 Instant,
# stored copies).
#
# The sections: licences, image_families, video_families and models. Settings (defaults, steps, guidance) live in config.yaml.
#
# licences: one record per licence, keyed by record id, in the order they are listed. Required: name, supplier, summary
# (short, plain language) and url. Optional: url_label (default "Licence") and attribution (a credit line the licence
# requires, shown only beside the model it belongs to). Links point to the licensor's original repository, never to a
# mirror the app downloads from. A gated repository, or one that ships no licence file, links its model page (url_label
# "Model page"); any other links its licence file, pinned to a commit. A contract test refuses any other URL.
#
# models: one entry per model, keyed by model id: an image or video alias, an audio model, enhancer-fast or enhancer-smart
# (the prompt enhancer tiers), seedvr2-7b or seedvr2-3b (the SeedVR2 upscale tiers, every weights format), or matte (the
# background removal models). The order of the entries is the order the Web UI lists them. Keys:
#   kind          image, video, audio, enhancer, upscaler or matte; image and video entries are aliases.
#   name          how the model reads in the Web UI.
#   licences      the record ids that cover the model, in display order, so a record several models share is written once.
#                 Every model the app downloads has an entry with at least one record, free licences included; a contract
#                 test refuses an entry that names an unknown record and a record no entry uses.
#   downloads     a list of targets, or one list per platform (darwin, win32, linux). A target has a ref (owner/repo@revision;
#                 unpinned only where the app does not pin the repo yet), files (allow patterns; none = the whole repo minus its
#                 ignore patterns, as for the Windows/Linux LTX diffusers repos; a macOS LTX pack, a SeedVR2 or matte target and a
#                 single-file companion must list their files, which the loaders read by name or position),
#                 ignore (patterns to skip; for an LTX diffusers repo, the one list the plan and the download skip),
#                 files_from: loader (the loader's planner lists the files; no code reads the marker) and a role (default model).
#                 Order is load-bearing: a model's own targets, then its family's companions.
#   download_size the one-time download, shown in the first-run dialog; a plain value, or one per platform.
#   family, version, quantize, build, transformer_format, kinds, lyrics, voices, limits, platforms, memory, memory_gb: see the
#   entries; a plain value applies to every platform and a mapping keyed by darwin, win32 and linux gives one value per platform.
#   Required beyond kind, name, licences and downloads: a video entry needs family (and quantize, 4 or 8, for ltx); an audio
#   entry needs family, kinds and limits; the seedvr2 entries need memory per platform.
# Gemma 3 is the text encoder of ltx-4 and ltx-8 on every platform; ltx25-4 uses Gemma 4, which is Apache-2.0, as are the
# text encoder and latent upscaler of h3, so these three carry no extra record.
licences:
  flux-nc:
    name: "FLUX Non-Commercial License v2.1"
    supplier: "Black Forest Labs"
    summary: "Non-commercial use of the model; images may be used commercially"
    url_label: "Model page"
