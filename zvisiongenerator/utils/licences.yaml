# The terms models come with: one record per licence, keyed by record id, in the order they are listed. Read by
# utils/licences.py directly; it is never merged with the user's config.yaml.
#
# A record covers one or more models (a model_aliases key, an audio_model_presets key, matte, the background removal
# models, seedvr2, the SeedVR2 upscale models, or enhancer-fast / enhancer-smart, the prompt enhancer tiers), and a model
# may be in two records. Every model the app downloads has a record, free licences included. Required: name, supplier,
# summary (short, plain language), url and models. Optional: url_label (default "Licence") and attribution (a credit line
# the licence requires, shown only beside the model it belongs to). Links point to the licensor's original repository,
# never to a mirror the app downloads from. A gated repository, or one that ships no licence file, links its model page
# (url_label "Model page"); any other links its licence file, pinned to a commit. A contract test refuses any other URL
# and any record that names an unknown model.
# Gemma 3 is the text encoder of ltx-4 and ltx-8 on every platform; ltx25-4 uses Gemma 4, which is Apache-2.0, as are the
# text encoder and latent upscaler of h3, so these three carry no extra record.
