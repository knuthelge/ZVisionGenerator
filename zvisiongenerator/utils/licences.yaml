# The terms models come with: one record per licence, keyed by record id, in the order they are listed. Read by
# utils/licences.py directly; it is never merged with the user's config.yaml.
#
# A record covers one or more models (a model_aliases key, an audio_model_presets key, or matte, the background removal
# models), and a model may be in two records. Required: name, supplier, summary (short, plain language), url and models.
# Optional: url_label (default "Licence") and attribution (a credit line the licence requires, shown only beside the
# model it belongs to). Links point to the licensor's original repository, never to a mirror the app downloads from.
# A gated repository's model page shows its terms and its access form, so that page is the link (url_label "Model page");
# a repository that is not gated links its licence file, pinned to a commit. A contract test refuses any other URL and
# any record that names an unknown model.
# Models under MIT or Apache-2.0 have no record. Gemma 3 is the text encoder of ltx-4 and ltx-8 on every platform;
# ltx25-4 uses Gemma 4, which is Apache-2.0.
flux-nc:
  name: "FLUX Non-Commercial License v2.1"
  supplier: "Black Forest Labs"
  summary: "Non-commercial"
  url_label: "Model page"
  url: "https://huggingface.co/black-forest-labs/FLUX.2-klein-9B"
  models: [klein9b]
krea-2-community:
  name: "Krea 2 Community License Agreement"
  supplier: "Krea"
  summary: "Free under $1M revenue"
  url: "https://cdn.jsdelivr.net/gh/krea-ai/krea-2@db3984fbc6e13b34c0064990fc2d95ac64d00058/assets/hf_samples/LICENSE.pdf"
