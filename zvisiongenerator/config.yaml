# ZVisionGenerator configuration: the settings and their defaults.
# Shipped inside the wheel via importlib.resources. Settings only: the facts about the built-in models (what each is,
# its licence, the files it downloads) are packaged metadata in utils/model_metadata.yaml, which this file cannot change.
# A user file (~/.ziv/config.yaml) is deep-merged over this one.

sizes:
  "1:1":
    xs: { width: 512,  height: 512  }
    s:  { width: 704,  height: 704  }
    m:  { width: 1024, height: 1024 }
    l:  { width: 1408, height: 1408 }
    xl: { width: 1600, height: 1600 }
  "16:9":
    xs: { width: 672,  height: 384  }
    s:  { width: 960,  height: 544  }
    m:  { width: 1344, height: 768  }
    l:  { width: 1920, height: 1088 }
    xl: { width: 2176, height: 1216 }
  "9:16":
    xs: { width: 384,  height: 672  }
    s:  { width: 544,  height: 960  }
    m:  { width: 768,  height: 1344 }
    l:  { width: 1088, height: 1920 }
    xl: { width: 1216, height: 2176 }
  "3:2":
    xs: { width: 576,  height: 384  }
    s:  { width: 864,  height: 576  }
    m:  { width: 1216, height: 832  }
    l:  { width: 1728, height: 1152 }
    xl: { width: 1920, height: 1280 }
  "2:3":
    xs: { width: 384,  height: 576  }
    s:  { width: 576,  height: 864  }
    m:  { width: 832,  height: 1216 }
    l:  { width: 1152, height: 1728 }
    xl: { width: 1280, height: 1920 }

generation:
  default_ratio: "2:3"
  default_size: m
  default_steps: 10
  default_guidance: 3.5
  seed_min: 4            # 2**2
  seed_max: 4294967295   # 2**32 - 1

sharpening:
  normal: 1.0
  upscaled: 1.2
  pre_upscale: 0.8
  # Upscaling an existing image from the Web UI viewer
  existing_upscaled: 1.2     # final pass
  existing_pre_upscale: 0    # after enlarging, before refining; 0 = off (the image is already sharpened)

upscale:
  default_denoise_2x: 0.4
  default_denoise_4x: 0.4
  # Upscaling an existing image from the Web UI viewer: denoise is picked by output size
  existing_denoise_small: 0.4      # outputs up to existing_large_megapixels
  existing_denoise_large: 0.2      # larger outputs
  existing_large_megapixels: 2
  max_megapixels: 20               # Largest output

seedvr2:                       # Plain upscale (Web UI viewer)
  model: auto                  # auto, seedvr2-3b or seedvr2-7b
  softness: 0.75               # 0-1: pre-blur before upscaling an image; 0 = off
  video_softness: 0.0          # Pre-blur before upscaling a video on Windows and Linux; 0 = off
  reference_megapixels: 16     # Output size the automatic tier must fit on a Mac (a typical 4x)

contrast:
  default_amount: 1.0

saturation:
  default_amount: 1.0

model_aliases: {}   # your own aliases: a name for a repo, a folder, or a {darwin, win32, linux} mapping; a built-in name always wins

# First-run dialog: the model it preselects. large_model is for machines with at least min_memory_gb of memory
# (unified memory on Apple Silicon, VRAM on a CUDA card); every other machine gets small_model.
first_run:
  large_model: klein9b
  small_model: klein4b
  min_memory_gb: 32

# Per-family defaults for image generation. A variant overrides its family; the scheduler default names the scheduler
# per backend (null = the model's own).
model_presets:
  zimage:
    default_steps: 10
    default_guidance: 0.0
    upscale:
      default_upscale_steps: 3
    default_scheduler:
      mflux: beta
      diffusers: beta

  flux2_klein:
    default_scheduler:
      mflux: null
      diffusers: null
    variants:
      distilled:
        default_steps: 4
        default_guidance: 1.0
      base:
        default_steps: 50
        default_guidance: 1.5

  flux2:
    default_steps: 20
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

  flux1:
    default_steps: 20
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

  ideogram4:
    default_steps: 8
    default_guidance: 1.0  # built into Instant; other values are ignored
    default_scheduler:
      mflux: null
      diffusers: null

  krea2:
    # Guidance is the standard CFG scale on both backends (1.0 = off); the diffusers
    # backend converts it to Krea 2's own scale, where 0.0 = off.
    default_steps: 8
    default_guidance: 1.0
    upscale:
      # 5 steps draw more skin texture than 3 without overcooking; pre-sharpening can leave coloured specks in fabric.
      default_upscale_steps: 5
      default_sharpen: false
    default_scheduler:  # beta draws more skin texture than Krea's evenly spaced schedule
      mflux: beta
      diffusers: beta

  moss:
    # Turbo and SFT are variants of one family, picked from the model folder.
    default_scheduler:
      mflux: null
      diffusers: null
    variants:
      turbo:
        default_steps: 4
        default_guidance: 1.0
        upscale:
          default_upscale_steps: 2
      sft:
        default_steps: 50
        default_guidance: 3.0
        upscale:
          default_upscale_steps: 12

  unknown:
    default_steps: 10
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

# --- Video generation ---
video_sizes:
  # All dimensions are 64-aligned for lossless half→double roundtrip with --upscale.
  # Frames follow 8k+1 pattern.
  "16:9":
    xs: { width: 576,  height: 320,  frames: 121 }
    s:  { width: 768,  height: 448,  frames: 121 }
    m:  { width: 1024, height: 576,  frames: 121 }
    l:  { width: 1280, height: 704,  frames: 121 }
    xl: { width: 1600, height: 896,  frames: 121 }
  "9:16":
    xs: { width: 320,  height: 576,  frames: 121 }
    s:  { width: 448,  height: 768,  frames: 121 }
    m:  { width: 576,  height: 1024, frames: 121 }
    l:  { width: 704,  height: 1280, frames: 121 }
    xl: { width: 896,  height: 1600, frames: 121 }
  "1:1":
    xs: { width: 384,  height: 384,  frames: 121 }
    s:  { width: 576,  height: 576,  frames: 121 }
    m:  { width: 768,  height: 768,  frames: 121 }
    l:  { width: 960,  height: 960,  frames: 121 }
    xl: { width: 1216, height: 1216, frames: 121 }

video_generation:
  default_ratio: "16:9"
  default_size: s

video_model_presets:
  ltx:
    default_steps: 8
    upscale:
      default_upscale_steps: 8
      # macOS: refine steps of an upscale of an existing video (1-3, the end of the stage-2 schedule). 3 re-renders faces and
      # scenes; 1 is the most faithful and the fastest.
      existing_video_steps: 2

  # MiniMax H3: 17-frame blocks, distilled to 4 or 8 steps by the turbo LoRA.
  h3:
    default_steps: 8
    default_frames: 124 # 5 s at 24 fps
    diffusers: # Windows/Linux
      ffn_chunk_tokens: 4096 # rows per feed-forward call; bounds its temporaries so long and large clips fit the GPU, at no cost in time

# --- Audio models ---

# Settings of the audio models (music, speech, sound), keyed by model id. A platforms entry (cuda | mps) overrides settings
# for that accelerator.
# docs/concepts/configuration.md describes every key.
audio_model_presets:
  yue2:
    settings:
      instrumental_sections: "[Intro] [Instrumental] [Solo] [Instrumental] [Solo] [Bridge] [Instrumental] [Outro]"
      abc_max_tokens: 4096
      cfg: 1.0
      ode_steps: 32
      memory_budget_gib: 24
      vae_core_frames: 512
      fade_seconds: 2
  qwen3_tts:
    settings: { language: auto, join_pause_ms: 300, join_fade_ms: 10, part_level_match_db: 3, edge_silence_max_ms: 150 }
  sa3:
    settings: { steps: 8, cfg_scale: 1.0, sample_size: 16777216 }

# --- Prompt enhancer (local LLM) ---

prompt_enhancer:
  # The Fast and Smart models are part of the app. Override them with prompt_enhancer.user_model (REPO[@REVISION] or a
  # folder) (Config page) or --enhance-model REPO[@REVISION].
  temperature: 0.7
  max_new_tokens: 700
  idle_release_seconds: 120
  length:
    percent: {shorter: 50, same: 100, longer: 200, extra: 300}
    floor_words: {shorter: 12, same: 25, longer: 40, extra: 80}  # same grows short prompts to 25 words; shorter never aims below 12
    max_words: 300

ui:
  startup_view: workspace
  gallery_page_size: 12
  output_dir: null  # unset: <data dir>/outputs, i.e. ~/.ziv/outputs or $ZIV_DATA_DIR/outputs
  default_models:
    image: klein9b
    video: ltx-8
  # Set once the first-run dialog is skipped; a user setting, not part of the writable config contract.
  first_run_skipped: false
  # Set when Show Hugging Face LoRAs is chosen in Discover LoRAs; a user setting, not part of the writable config contract.
  discover_huggingface: false
  # Discover's content filter on Hugging Face results: hides repos tagged as adult and repos named with explicit terms.
  # Set to off if it hides a LoRA you want to use; repos tagged as adult stay hidden.
  discover_content_filter: on
