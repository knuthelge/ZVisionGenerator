# ZVisionGenerator configuration — all defaults and model presets in one file.
# Shipped inside the wheel via importlib.resources.
# User can override with ~/.ziv/config.yaml (deep-merged).

sizes:
  "1:1":
    xs: { width: 512,  height: 512  }
    s:  { width: 704,  height: 704  }
    m:  { width: 1024, height: 1024 }
    l:  { width: 1440, height: 1440 }
    xl: { width: 1600, height: 1600 }
  "16:9":
    xs: { width: 672,  height: 384  }
    s:  { width: 944,  height: 528  }
    m:  { width: 1344, height: 768  }
    l:  { width: 1888, height: 1056 }
    xl: { width: 2112, height: 1184 }
  "9:16":
    xs: { width: 384,  height: 672  }
    s:  { width: 528,  height: 944  }
    m:  { width: 768,  height: 1344 }
    l:  { width: 1056, height: 1888 }
    xl: { width: 1184, height: 2112 }
  "3:2":
    xs: { width: 608,  height: 400  }
    s:  { width: 864,  height: 576  }
    m:  { width: 1216, height: 832  }
    l:  { width: 1728, height: 1152 }
    xl: { width: 1936, height: 1296 }
  "2:3":
    xs: { width: 400,  height: 608  }
    s:  { width: 576,  height: 864  }
    m:  { width: 832,  height: 1216 }
    l:  { width: 1152, height: 1728 }
    xl: { width: 1296, height: 1936 }

generation:
  default_ratio: "2:3"
  default_size: m
  default_steps: 10
  default_guidance: 3.5
  seed_min: 4            # 2**2
  seed_max: 4294967295   # 2**32 - 1

sharpening:
  normal: 1.0
  upscaled: 1.2
  pre_upscale: 0.8
  # Upscaling an existing image from the Web UI viewer
  existing_upscaled: 1.2     # final pass
  existing_pre_upscale: 0    # after enlarging, before refining; 0 = off (the image is already sharpened)

upscale:
  default_denoise_2x: 0.4
  default_denoise_4x: 0.4
  # Upscaling an existing image from the Web UI viewer: denoise is picked by output size
  existing_denoise_small: 0.4      # outputs up to existing_large_megapixels
  existing_denoise_large: 0.2      # larger outputs
  existing_large_megapixels: 2
  max_megapixels: 20               # Largest output

contrast:
  default_amount: 1.0

saturation:
  default_amount: 1.0

schedulers:
  beta:
    mflux_class: "zvisiongenerator.schedulers.beta_scheduler.BetaScheduler"
    # diffusers uses built-in: FlowMatchEulerDiscreteScheduler(use_beta_sigmas=True)

platforms:
  darwin: macOS
  win32: Windows
  linux: Linux

model_aliases:
  ltx-8:
    darwin: "dgrauet/ltx-2.3-mlx-q8"
    win32:
      message: "Alias 'ltx-8' is macOS-only. On Windows, use 'ltx-2.3' for the CUDA diffusers backend."
    linux:
      message: "Alias 'ltx-8' is macOS-only. On Linux, use 'ltx-2.3' for the CUDA diffusers backend."
  ltx-4:
    darwin: "dgrauet/ltx-2.3-mlx-q4"
    win32:
      message: "Alias 'ltx-4' is macOS-only. On Windows, use 'ltx-2.3' for the CUDA diffusers backend."
    linux:
      message: "Alias 'ltx-4' is macOS-only. On Linux, use 'ltx-2.3' for the CUDA diffusers backend."
  ltx-2.3:
    darwin:
      message: "Alias 'ltx-2.3' is available on Windows and Linux only. On macOS, use 'ltx-4' or 'ltx-8'."
    win32: "${video_model_presets.ltx.diffusers.default_repo}"
    linux: "${video_model_presets.ltx.diffusers.default_repo}"
  zit: "Tongyi-MAI/Z-Image-Turbo"
  klein9b: "black-forest-labs/FLUX.2-klein-9B"
  klein4b: "black-forest-labs/FLUX.2-klein-4B"
  krea2: "unsloth/Krea-2-Turbo"
  ideo:
    darwin: "ideogram-ai/ideogram-4-fp8"
    win32:
      message: "Alias 'ideo' is macOS-only. Ideogram 4 requires the mflux/MLX backend."
    linux:
      message: "Alias 'ideo' is macOS-only. Ideogram 4 requires the mflux/MLX backend."

# Declared per-alias image families let the Web UI surface known aliases offline
# (no network round-trip through detect_image_model).
model_alias_families:
  ideo: ideogram4
  krea2: krea2

model_presets:
  zimage:
    supports_negative_prompt: true
    default_steps: 10
    default_guidance: 0.0
    upscale:
      default_upscale_steps: 3
    default_scheduler:
      mflux: beta
      diffusers: null

  flux2_klein:
    supports_negative_prompt: false
    default_scheduler:
      mflux: null
      diffusers: null
    variants:
      distilled:
        default_steps: 4
        default_guidance: 1.0
      base:
        default_steps: 50
        default_guidance: 1.5

  flux2:
    supports_negative_prompt: false
    default_steps: 20
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

  flux1:
    supports_negative_prompt: false
    enhance_max_words: 180  # FLUX.1-schnell reads only 256 T5 tokens
    default_steps: 20
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

  ideogram4:
    supports_negative_prompt: false
    supports_img2img: false
    supports_upscale: false
    supports_quantize: false
    supports_json_prompt: true
    supports_first_sigma: true
    dimension_min: 256
    dimension_max: 2048
    dimension_step: 16
    default_steps: 20
    default_guidance: 7.0
    default_scheduler:
      mflux: null
      diffusers: null

  krea2:
    # Guidance is the standard CFG scale on both backends (1.0 = off); the diffusers
    # backend converts it to Krea 2's own scale, where 0.0 = off.
    supports_negative_prompt: false
    supports_scheduler: false  # Krea 2 samples with its own schedule
    default_steps: 8
    default_guidance: 1.0
    upscale:
      default_upscale_steps: 3  # ranked best against 1, 2, 4 and 8 refinement steps
    default_scheduler:
      mflux: null
      diffusers: null

  unknown:
    supports_negative_prompt: false
    default_steps: 10
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

# --- Video generation ---

video_sizes:
  # All dimensions are 64-aligned for lossless half→double roundtrip with --upscale.
  # Frames follow 8k+1 pattern.
  "16:9":
    s:  { width: 512,  height: 256,  frames: 49 }
    m:  { width: 704,  height: 448,  frames: 49 }
    l:  { width: 960,  height: 512,  frames: 33 }
    xl: { width: 1408, height: 896,  frames: 25 }
  "9:16":
    s:  { width: 256,  height: 512,  frames: 49 }
    m:  { width: 448,  height: 704,  frames: 49 }
    l:  { width: 512,  height: 960,  frames: 33 }
    xl: { width: 896,  height: 1408, frames: 25 }
  "1:1":
    s:  { width: 384,  height: 384,  frames: 49 }
    m:  { width: 512,  height: 512,  frames: 33 }
    l:  { width: 768,  height: 768,  frames: 33 }
    xl: { width: 1024, height: 1024, frames: 25 }

video_generation:
  default_ratio: "16:9"
  default_size: m

video_model_presets:
  ltx:
    default_steps: 8
    diffusers:
      # Configurable diffusers-converted LTX 2.3 repository used for Windows/Linux.
      default_repo: "dg845/LTX-2.3-Diffusers"
    upscale:
      default_upscale_steps: 8

# --- Prompt enhancer (local LLM) ---

prompt_enhancer:
  # Public Hugging Face repos, pinned. Override with prompt_enhancer.user_model (REPO[@REVISION] or a folder)
  # (Config page) or --enhance-model REPO[@REVISION].
  model:
    darwin: McG-221/Qwen3.5-4B-heretic-mlx-4Bit
    win32: coder3101/Qwen3.5-4B-heretic
    linux: coder3101/Qwen3.5-4B-heretic
  revision:
    darwin: 7a6b22e4cd458ba20a8c2737634a932f2b572ef2
    win32: dc69b95668662490d2f84db1cf0bb61f8743f806
    linux: dc69b95668662490d2f84db1cf0bb61f8743f806
  download_size_label:
    darwin: 2.4 GB
    win32: 9 GB
    linux: 9 GB
  temperature: 0.7
  max_new_tokens: 700
  idle_release_seconds: 120
  length:
    percent: {shorter: 50, same: 100, longer: 200, extra: 300}
    floor_words: {shorter: 12, longer: 40, extra: 80}  # shorter never aims below 12 words
    max_words: 300

ui:
  startup_view: workspace
  gallery_page_size: 12
  output_dir: ~/.ziv/outputs
  default_models:
    image: klein9b
    video: ltx-8
