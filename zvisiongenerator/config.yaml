# ZVisionGenerator configuration — all defaults and model presets in one file.
# Shipped inside the wheel via importlib.resources.
# User can override with ~/.ziv/config.yaml (deep-merged).

sizes:
  "1:1":
    xs: { width: 512,  height: 512  }
    s:  { width: 704,  height: 704  }
    m:  { width: 1024, height: 1024 }
    l:  { width: 1408, height: 1408 }
    xl: { width: 1600, height: 1600 }
  "16:9":
    xs: { width: 672,  height: 384  }
    s:  { width: 960,  height: 544  }
    m:  { width: 1344, height: 768  }
    l:  { width: 1920, height: 1088 }
    xl: { width: 2176, height: 1216 }
  "9:16":
    xs: { width: 384,  height: 672  }
    s:  { width: 544,  height: 960  }
    m:  { width: 768,  height: 1344 }
    l:  { width: 1088, height: 1920 }
    xl: { width: 1216, height: 2176 }
  "3:2":
    xs: { width: 576,  height: 384  }
    s:  { width: 864,  height: 576  }
    m:  { width: 1216, height: 832  }
    l:  { width: 1728, height: 1152 }
    xl: { width: 1920, height: 1280 }
  "2:3":
    xs: { width: 384,  height: 576  }
    s:  { width: 576,  height: 864  }
    m:  { width: 832,  height: 1216 }
    l:  { width: 1152, height: 1728 }
    xl: { width: 1280, height: 1920 }

generation:
  default_ratio: "2:3"
  default_size: m
  default_steps: 10
  default_guidance: 3.5
  seed_min: 4            # 2**2
  seed_max: 4294967295   # 2**32 - 1

sharpening:
  normal: 1.0
  upscaled: 1.2
  pre_upscale: 0.8
  # Upscaling an existing image from the Web UI viewer
  existing_upscaled: 1.2     # final pass
  existing_pre_upscale: 0    # after enlarging, before refining; 0 = off (the image is already sharpened)

upscale:
  default_denoise_2x: 0.4
  default_denoise_4x: 0.4
  # Upscaling an existing image from the Web UI viewer: denoise is picked by output size
  existing_denoise_small: 0.4      # outputs up to existing_large_megapixels
  existing_denoise_large: 0.2      # larger outputs
  existing_large_megapixels: 2
  max_megapixels: 20               # Largest output

seedvr2:                       # Plain upscale (Web UI viewer)
  model: auto                  # auto, seedvr2-3b or seedvr2-7b
  softness: 0.75               # 0-1: pre-blur before upscaling an image; 0 = off
  video_softness: 0.0          # Pre-blur before upscaling a video on Windows and Linux; 0 = off
  reference_megapixels: 16     # Output size the automatic tier must fit on a Mac (a typical 4x)
  tiers:                       # macOS, 8-bit, quality order; the first within this Mac's memory budget at reference_megapixels is used.
    # Estimate = weights_gb + max(activation_floor_gb, activation_base_gb + activation_gb_per_mp * MP)
    - {model: seedvr2-7b, weights_gb: 9.26, activation_floor_gb: 10.79, activation_base_gb: 1.88, activation_gb_per_mp: 0.83}
    - {model: seedvr2-3b, weights_gb: 4.72, activation_floor_gb: 10.79, activation_base_gb: 1.10, activation_gb_per_mp: 0.89}
  discrete_tiers:              # Windows/Linux, FP8 streamed from system memory, quality order; the first whose system_gb fits this machine is used.
    # GPU estimate as above (weights_gb = CUDA context, the parts kept on the GPU and ~0.7 GB other apps use); system_gb = peak system memory plus 3 GB for everything else
    - {model: seedvr2-7b, weights_gb: 1.6, activation_floor_gb: 5.0, activation_base_gb: 0.21, activation_gb_per_mp: 0.556, system_gb: 22}
    - {model: seedvr2-3b, weights_gb: 1.6, activation_floor_gb: 5.0, activation_base_gb: 0.25, activation_gb_per_mp: 0.6, system_gb: 12.5}

contrast:
  default_amount: 1.0

saturation:
  default_amount: 1.0

schedulers:
  beta:
    mflux_class: "zvisiongenerator.schedulers.beta_scheduler.BetaScheduler"
    # diffusers: Z-Image gets the beta grid as custom sigmas (same shape as mflux); other models use
    # FlowMatchEulerDiscreteScheduler(use_beta_sigmas=True)

platforms:
  darwin: macOS
  win32: Windows
  linux: Linux

model_aliases:
  # On Windows/Linux both LTX aliases load the diffusers repo, at the quantize level
  # video_model_presets.ltx.diffusers.quantize sets for each.
  ltx-8:
    darwin: "${video_model_presets.ltx.mlx_base.q8}"
    win32: "${video_model_presets.ltx.diffusers.default_repo}"
    linux: "${video_model_presets.ltx.diffusers.default_repo}"
  ltx-4:
    darwin: "${video_model_presets.ltx.mlx_base.q4}"
    win32: "${video_model_presets.ltx.diffusers.default_repo}"
    linux: "${video_model_presets.ltx.diffusers.default_repo}"
  # On macOS the LTX aliases load the pinned MLX packs of video_model_presets.ltx.mlx_base, so an alias, the download
  # plan and the Models page read one revision and one file list.
  # LTX-2.5 (video_model_presets.ltx.versions.ltx25). Windows/Linux load the diffusers repo; macOS loads the MLX
  # distilled files from MarceloFSO/ltx-2.5-mlx-q4-fast, an ungated mirror of dgrauet/ltx-2.5-mlx-q4, distilled
  # files only, sha256-identical; pinned.
  ltx25-4:
    darwin: "${video_model_presets.ltx.versions.ltx25.mlx_base.q4}"
    win32: "${video_model_presets.ltx.versions.ltx25.diffusers.default_repo}"
    linux: "${video_model_presets.ltx.versions.ltx25.diffusers.default_repo}"
  # MiniMax H3 (video_model_presets.h3): the same pinned repository on every platform. Windows/Linux stream it from a
  # stored 4-bit copy; macOS runs the MLX port from the INT8 transformer under mlx below.
  h3: "${video_model_presets.h3.repo_ref}"
  zit: "Tongyi-MAI/Z-Image-Turbo"
  # klein9b: ungated mirror of black-forest-labs/FLUX.2-klein-9B, weights checked by sha256.
  klein9b: "unsloth/FLUX.2-klein-9B"
  klein4b: "black-forest-labs/FLUX.2-klein-4B"
  krea2: "unsloth/Krea-2-Turbo"
  # Ideogram 4 Instant: the models-folder entry of the same name, built on first use from ideogram4_instant below.
  ideo: "ideo"
  # MOSS-Image: models-folder entries built on first use from moss_image below. Windows/Linux only.
  # moss is Turbo (the SFT model with a 4-step LoRA); moss-sft is the SFT model as released.
  moss:
    win32: "moss"
    linux: "moss"
  moss-sft:
    win32: "moss-sft"
    linux: "moss-sft"

# Ideogram 4 Instant, fal's 8-step distilled Ideogram 4 (one transformer, guidance built in), under Ideogram's
# non-commercial license. fal's own repo (fal/ideogram-v4-instant) is gated, so the transformer comes from an ungated
# single-file repackage whose tensors were checked against fal's; the text encoder, VAE, tokenizer and scheduler come
# from Unsloth's ungated mirrors of the base model, checked byte for byte against the official repos. Every source is
# pinned to the checked revision; changing a pin rebuilds the folder.
ideogram4_instant:
  transformer:
    repo: "Hippotes/Ideogram4-Fal-ComfyUI"
    revision: "9fcb42ce3f82267f61123755d4b65227c2e53a69"
    filename: "Ideogram4-instant_bf16.safetensors"
  components:
    darwin: "unsloth/ideogram-4-fp8@518e05e745736960acb56d8726138ffbc174f0a9"
    win32: "unsloth/ideogram-4-nf4-diffusers@cb5b5dda5e0406c04160f3555c48256ec0cfc899"
    linux: "unsloth/ideogram-4-nf4-diffusers@cb5b5dda5e0406c04160f3555c48256ec0cfc899"
  # fp8: the base FP8 repo's layout, which mflux loads. bf16: diffusers' layout, quantized by the stored-quant flow.
  transformer_format:
    darwin: "fp8"
    win32: "bf16"
    linux: "bf16"

# MOSS-Image (OpenMOSS-Team), a text-to-image model with a 5B transformer and a Qwen3.5-based text encoder of about
# 8B. The SFT checkpoint and a community 4-step Turbo LoRA are downloaded once and linked into the moss and moss-sft
# model folders. Every source is pinned; changing a pin rebuilds the affected folder. sft must name the same revision as MOSS_REVISION in the Makefile (the vendored pipeline's
# revision). A new Turbo LoRA also means a new variants.turbo.default_steps under model_presets.moss.
moss_image:
  sft: "OpenMOSS-Team/MOSS-Image-SFT@f972bd4b4b9e3852133cc5da954d87bc32cd8fb9"
  turbo_lora:
    repo: "akhaliq/MOSS-Image-SFT-4-steps"
    revision: "2ded95c37a029360245926fe72e475e30039bbfb"
    filename: "moss_image_sft_4step_v2.0.safetensors"

# Declared per-alias image families let the Web UI surface known aliases offline
# (no network round-trip through detect_image_model).
model_alias_families:
  ideo: ideogram4
  krea2: krea2

# How an alias reads in the Web UI; the alias stays its id everywhere else (CLI, prompt files, API).
# download_size_label (image aliases) is the one-time download per platform, in whole GB, shown in the first-run dialog.
model_labels:
  klein9b:
    name: "FLUX.2 Klein 9B"
    download_size_label:
      darwin: 35 GB
      win32: 35 GB
      linux: 35 GB
  klein4b:
    name: "FLUX.2 Klein 4B"
    download_size_label:
      darwin: 16 GB
      win32: 16 GB
      linux: 16 GB
  zit:
    name: "Z-Image Turbo"
    download_size_label:
      darwin: 33 GB
      win32: 33 GB
      linux: 33 GB
  krea2:
    name: "Krea 2 Turbo"
    download_size_label:
      darwin: 36 GB
      win32: 36 GB
      linux: 36 GB
  ideo:
    name: "Ideogram 4 Instant"
    download_size_label:
      darwin: 28 GB
      win32: 24 GB
      linux: 24 GB
  moss:
    name: "MOSS-Image Turbo"
    download_size_label:
      win32: 28 GB
      linux: 28 GB
  moss-sft:
    name: "MOSS-Image SFT"
    download_size_label:
      win32: 27 GB
      linux: 27 GB
  ltx-8:
    name: "LTX-2.3 8-bit"
  ltx-4:
    name: "LTX-2.3 4-bit"
  ltx25-4:
    name: "LTX-2.5 4-bit"
  h3:
    name: "MiniMax H3"

# First-run dialog: the model it preselects. large_model is for machines with at least min_memory_gb of memory
# (unified memory on Apple Silicon, VRAM on a CUDA card); every other machine gets small_model.
first_run:
  large_model: klein9b
  small_model: klein4b
  min_memory_gb: 32

model_presets:
  zimage:
    supports_negative_prompt: true
    default_steps: 10
    default_guidance: 0.0
    upscale:
      default_upscale_steps: 3
    default_scheduler:
      mflux: beta
      diffusers: beta

  flux2_klein:
    supports_negative_prompt: false
    max_reference_images: 4  # BFL documents up to 4; neither library enforces a count
    default_scheduler:
      mflux: null
      diffusers: null
    variants:
      distilled:
        default_steps: 4
        default_guidance: 1.0
      base:
        default_steps: 50
        default_guidance: 1.5

  flux2:
    supports_negative_prompt: false
    default_steps: 20
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

  flux1:
    supports_negative_prompt: false
    enhance_max_words: 180  # FLUX.1-schnell reads only 256 T5 tokens
    default_steps: 20
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

  ideogram4:
    supports_negative_prompt: false
    supports_img2img: false
    supports_upscale: false
    supports_json_prompt: true
    supports_first_sigma: true
    dimension_min: 256
    dimension_max: 2048
    dimension_step: 16
    default_steps: 8
    default_guidance: 1.0  # built into Instant; other values are ignored
    default_scheduler:
      mflux: null
      diffusers: null

  krea2:
    # Guidance is the standard CFG scale on both backends (1.0 = off); the diffusers
    # backend converts it to Krea 2's own scale, where 0.0 = off.
    supports_negative_prompt: false
    supports_scheduler: false  # Krea 2 samples with its own schedule
    default_steps: 8
    default_guidance: 1.0
    upscale:
      default_upscale_steps: 3  # ranked best against 1, 2, 4 and 8 refinement steps
    default_scheduler:
      mflux: null
      diffusers: null

  moss:
    # Turbo and SFT are variants of one family, picked from the model folder. A variant may also set capability flags.
    supports_negative_prompt: true
    supports_scheduler: false  # MOSS samples with its own schedule (Euler, shift 5)
    default_scheduler:
      mflux: null
      diffusers: null
    variants:
      turbo:
        default_steps: 4
        default_guidance: 1.0
        supports_negative_prompt: false
        negative_prompt_hint: Use -m moss-sft for negative prompts.
        upscale:
          default_upscale_steps: 2
      sft:
        default_steps: 50
        default_guidance: 3.0
        upscale:
          default_upscale_steps: 12

  unknown:
    supports_negative_prompt: false
    default_steps: 10
    default_guidance: 3.5
    default_scheduler:
      mflux: null
      diffusers: null

# --- Video generation ---

video_sizes:
  # All dimensions are 64-aligned for lossless half→double roundtrip with --upscale.
  # Frames follow 8k+1 pattern.
  "16:9":
    xs: { width: 576,  height: 320,  frames: 121 }
    s:  { width: 768,  height: 448,  frames: 121 }
    m:  { width: 1024, height: 576,  frames: 121 }
    l:  { width: 1280, height: 704,  frames: 121 }
    xl: { width: 1600, height: 896,  frames: 121 }
  "9:16":
    xs: { width: 320,  height: 576,  frames: 121 }
    s:  { width: 448,  height: 768,  frames: 121 }
    m:  { width: 576,  height: 1024, frames: 121 }
    l:  { width: 704,  height: 1280, frames: 121 }
    xl: { width: 896,  height: 1600, frames: 121 }
  "1:1":
    xs: { width: 384,  height: 384,  frames: 121 }
    s:  { width: 576,  height: 576,  frames: 121 }
    m:  { width: 768,  height: 768,  frames: 121 }
    l:  { width: 960,  height: 960,  frames: 121 }
    xl: { width: 1216, height: 1216, frames: 121 }

video_generation:
  default_ratio: "16:9"
  default_size: s

video_model_presets:
  ltx:
    label: "LTX distilled model"
    default_steps: 8
    max_steps: 8
    # Valid frame counts are alignment * k + offset (8k+1: 9, 17, ... 121); another count moves to the nearest one.
    frame_rule: { alignment: 8, offset: 1, round: nearest }
    # An extension adds frames in multiples of this.
    extend_frame_step: 8
    # The frames of the source's end an extension carries into its window (4 latent frames); the window is these plus the new frames.
    carry_frames: 25
    capabilities: { i2v: true, end_frame: true, extend: true, upscale: true, upscale_review: true, lora: true, audio: true, low_memory: true }
    diffusers:
      # Distilled LTX 2.3 in diffusers format, used on Windows/Linux (8 steps, guidance 1.0). Distilled checkpoints only.
      # Every LTX-2.3 source is pinned: Lightricks deletes and moves files in its repo.
      # Its text encoder, connectors, VAEs and vocoder are used; the transformer comes from the file below.
      default_repo: "diffusers/LTX-2.3-Distilled-Diffusers@432e0d3c2d1769aaa4d295f9243f7062bf6b47ee"
      # The distilled transformer: one single-file LTX-2 checkpoint in a Hugging Face repo (1.1 matches macOS).
      # Leave it out to use the default repo's own transformer.
      transformer:
        repo: "Lightricks/LTX-2.3@c1521179de480464f366a98a9d9b2acc4cc097b9"
        filename: "ltx-2.3-22b-distilled-1.1.safetensors"
      # Quantize level per model alias: 4 = NF4 transformer, 8 = FP8 transformer; both with an FP8 text encoder
      # and connectors. Only these names load on Windows/Linux. Prepared copies are the alias's stored copy, ~/.ziv/models/<alias>@q<bits>.
      quantize:
        ltx-4: 4
        ltx-8: 8
      # 2x spatial latent upsampler for --upscale 2: one safetensors file in a Hugging Face repo.
      latent_upsampler:
        repo: "Lightricks/LTX-2.3@c1521179de480464f366a98a9d9b2acc4cc097b9"
        filename: "ltx-2.3-spatial-upscaler-x2-1.1.safetensors"
    upscale:
      default_upscale_steps: 8
    # Lightricks' distilled LoRA: `ziv model model --model-type ltx-2.3 --distill` merges it into a plain-dev
    # checkpoint, which otherwise renders broken at the 8 steps the app runs LTX at.
    distilled_lora:
      repo: "Lightricks/LTX-2.3@c1521179de480464f366a98a9d9b2acc4cc097b9"
      filename: "ltx-2.3-22b-distilled-lora-384-1.1.safetensors"
    # macOS: the pinned MLX pack of each quantize level (the ltx-4 and ltx-8 aliases), and the folder a converted
    # checkpoint takes its VAEs, vocoder, upsampler and configs from. A pack is downloaded as exactly the files of
    # mlx_files, at its pinned revision. After changing a pin, list the files of the new revision that the vendored
    # loader reads: the pack repos hold files the app never loads (other transformers, LoRAs, other upsamplers).
    mlx_base:
      q4: "dgrauet/ltx-2.3-mlx-q4@56a5866d638ecfe37c54d348e88938235185c2d4"
      q8: "dgrauet/ltx-2.3-mlx-q8@6671a7572a530862d1d60ce393b5d93491e3f76b"
    mlx_files:
      - transformer-distilled-1.1.safetensors
      - connector.safetensors
      - vae_encoder.safetensors
      - vae_decoder.safetensors
      - audio_vae.safetensors
      - vocoder.safetensors
      - spatial_upscaler_x2_v1_1.safetensors
      - spatial_upscaler_x2_v1_1_config.json
      - embedded_config.json
      - config.json
    # macOS: the Gemma 3 text encoder the LTX-2.3 packs encode prompts with, pinned; LTX-2.5 packs bundle their own.
    mlx_text_encoder: "mlx-community/gemma-3-12b-it-4bit@86cc6a8dedbc456dd0e4af01a9d09f396f77e558"
    # Per-version overlays: a version's block is merged over this family preset for the aliases it lists
    # (CLI flags > version > family > global). The family block above is LTX-2.3.
    versions:
      ltx25:
        aliases: [ltx25-4]
        # `ziv model model --model-type ltx-2.5` converts into this version.
        model_type: ltx-2.5
        # Lightricks' LTX-2.5 distilled LoRA for --distill: an ungated copy whose size and SHA-256
        # (86370bbf79a9eb4edaa158907e2b48a5188fe4c5dc8ce30c7eb8f2f131a9bbf5, 8,899,889,568 bytes) equal the gated
        # original's, Lightricks/LTX-2.5 loras/ltx-2.5-22b-distilled-lora-450-bf16.safetensors; pinned.
        distilled_lora:
          repo: "lxxxy6/LTX-2.5@3506f52caf688795fc35edbf0d1b197bc30f3df1"
          filename: "ltx-2.5-22b-distilled-lora-450-bf16.safetensors"
        # macOS: the MLX folder a converted LTX-2.5 checkpoint takes its Gemma 4 text encoder, VAEs, duration head,
        # upsampler and configs from (the ltx25-4 repo). It only has q4, and its quantize_config.json is linked at both levels:
        # the MLX loader reads the bits from the weights' shapes.
        mlx_base:
          q4: "MarceloFSO/ltx-2.5-mlx-q4-fast@281bf05bd23207d6feef708fc2e270f84ba992b5"
          q8: "MarceloFSO/ltx-2.5-mlx-q4-fast@281bf05bd23207d6feef708fc2e270f84ba992b5"
        # The files of that pack the app loads.
        mlx_files:
          - transformer-distilled.safetensors
          - text_encoder.safetensors
          - text_encoder_config.json
          - tokenizer.json
          - tokenizer_config.json
          - chat_template.jinja
          - connector.safetensors
          - vae_decoder_conv.safetensors
          - vae_encoder_conv.safetensors
          - audio_vae.safetensors
          - vocoder.safetensors
          - spatial_upscaler_x2_v1_0.safetensors
          - spatial_upscaler_x2_v1_0_config.json
          - duration_head.safetensors
          - embedded_config.json
          - quantize_config.json
        diffusers:
          # Ungated, byte-identical copy of Lightricks/LTX-2.5-Diffusers (bf16 despite its name), pinned.
          default_repo: "unsloth/LTX-2.5-FP8@7b40724fc39bbb01d9b4d72638c0d263531c88c2"
          transformer: null # the repo's own transformer folder
          quantize:
            ltx25-4: 4
          latent_upsampler:
            repo: "${video_model_presets.ltx.versions.ltx25.diffusers.default_repo}"
            filename: "latent_upsampler/diffusion_pytorch_model.safetensors"
          repo_ignore: ["LTX-2.5-*.safetensors", "samples/*"] # root single-file checkpoints (69 GB) and samples
          image_crf: 18 # i2v conditioning image, re-compressed before the fit
          sampler: euler_ancestral # upstream distilled sampler; step noise from seed + 10000 / + 20000

  # MiniMax H3: 17-frame blocks, distilled to 4 or 8 steps by the turbo LoRA below. Valid frame counts are 17k+5 (22, 39,
  # ... 124 is 5 s); a count between two moves up to the next one, and there is no length cap.
  h3:
    label: "MiniMax H3"
    repo_ref: "MiniMaxAI/MiniMax-H3@42ed227ee7df40d41602854ae760620d6eb651fe"
    default_steps: 8
    max_steps: 8
    step_options: [4, 8] # both run from the one stored copy (it holds the fold tables of both schedules)
    default_frames: 124 # 5 s at 24 fps
    frame_rule: { alignment: 17, offset: 5, round: up }
    extend_frame_step: 17
    extend_fps: 24 # an Extend source must run at 24 fps
    carry_frames: 22 # 17 * 1 + 5, the smallest valid clip
    platform_carry_frames: { darwin: 1 } # macOS renders an image-to-video clip from the source's last frame, so one frame is carried
    capabilities: { i2v: true, end_frame: true, extend: true, upscale: true, upscale_review: true, lora: true, audio: true, low_memory: false }
    platform_capabilities:
      darwin: { upscale: false, upscale_review: false }
    diffusers: # Windows/Linux
      # The main repository is downloaded without the parts the app never loads (it encodes prompts with the separate text encoder below).
      repo_allow: ["model_index.json", "LICENSE", "scheduler/*", "audio_scheduler/*", "transformer/*", "vae/*", "audio_vae/*", "tokenizer/*", "processor/*"]
      repo_ignore: ["text_encoder/*", "transformer_ref/*", "FL2VA/*", "Ref2VA/*", "assets/*", "docs/*", "scripts/*"]
      # Qwen3-VL 32B Instruct, NF4: the first four of five weight shards hold the 50 layers the model reads.
      text_encoder:
        repo: "unsloth/Qwen3-VL-32B-Instruct-bnb-4bit@48cfc6496841742a77892646c15a7f3e8da44348"
        files: ["config.json", "model.safetensors.index.json", "model-00001-of-00005.safetensors", "model-00002-of-00005.safetensors", "model-00003-of-00005.safetensors", "model-00004-of-00005.safetensors"]
        layers: 50
      # The 8-step turbo LoRA, merged into the stored copy. Its scale replaces alpha/rank and is never multiplied by it.
      lora:
        repo: "lightx2v/Minimax-h3-Turbo@30f485ed874aa44c8183348ad361c5eabad318da"
        filename: "minimax_h3_fl2v_turbo_8step_v1.0_768p_bf16.safetensors"
        scale: 0.0625
      # The 3D latent upscaler of the H3 upscale: a 2x enlargement of the stage-1 latents before a short full-size refinement.
      # sha256 043e5a48e161610ef6c3ea974645220354d06fa618abca15f76d084812eb55c2, 690,592,672 bytes, Apache-2.0, ungated.
      # Run in fp16. There is no runtime hash check: the revision pin fixes the file and the strict load rejects a wrong one.
      latent_upsampler:
        repo: "LBH-123-AI/Minimax_h3_latent_Upscaler@3f941d5d182014dd5c0a5e16330420ee2d4aa0c6"
        filename: "minimax_h3_latent_upscaler_3d_conv_v1/minimax_h3_latent_upscaler_3d_conv_v1_fp16.safetensors"  # in a subfolder of the repository
      schedules:
        8: { forwards: 8, video_shift: 6.0, audio_shift: 3.0 }
        4: { forwards: 4, video_shift: 6.0, audio_shift: 3.0 }
      attention: sdpa
      ffn_chunk_tokens: 4096 # rows per feed-forward call; bounds its temporaries so long and large clips fit the GPU, at no cost in time
    mlx: # macOS: every file is listed, so a download is checked file by file
      # The INT8 transformer (Argus-calibrated); the 8-step turbo LoRA of the diffusers block is applied unfused at run time.
      transformer:
        repo: "water1234/MiniMax-H3-MLX-Argus-Calibrated-INT8@70505b09c80e298e684d798d8e0f946937dcfad4"
        files: ["config.json", "quant_config.json", "model.safetensors.index.json", "model-00001-of-00008.safetensors", "model-00002-of-00008.safetensors", "model-00003-of-00008.safetensors", "model-00004-of-00008.safetensors", "model-00005-of-00008.safetensors", "model-00006-of-00008.safetensors", "model-00007-of-00008.safetensors", "model-00008-of-00008.safetensors"]
      # The FL2VA parts of repo_ref the pipeline loads: tokenizer, processor, both VAEs and shards 1-11 and 14 of the text encoder.
      components:
        files:
          - "FL2VA/model_index.json"
          - "FL2VA/tokenizer/merges.txt"
          - "FL2VA/tokenizer/tokenizer.json"
          - "FL2VA/tokenizer/tokenizer_config.json"
          - "FL2VA/tokenizer/vocab.json"
          - "FL2VA/processor/chat_template.json"
          - "FL2VA/processor/merges.txt"
          - "FL2VA/processor/preprocessor_config.json"
          - "FL2VA/processor/tokenizer.json"
          - "FL2VA/processor/tokenizer_config.json"
          - "FL2VA/processor/video_preprocessor_config.json"
          - "FL2VA/processor/vocab.json"
          - "FL2VA/video_vae/config.json"
          - "FL2VA/video_vae/source/config.json"
          - "FL2VA/video_vae/source/model.safetensors"
          - "FL2VA/audio_vae/config.json"
          - "FL2VA/audio_vae/config.yaml"
          - "FL2VA/audio_vae/metadata.json"
          - "FL2VA/audio_vae/model.safetensors"
          - "FL2VA/text_encoder/config.json"
          - "FL2VA/text_encoder/model.safetensors.index.json"
          - "FL2VA/text_encoder/model-00001-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00002-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00003-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00004-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00005-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00006-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00007-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00008-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00009-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00010-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00011-of-00014.safetensors"
          - "FL2VA/text_encoder/model-00014-of-00014.safetensors"
      # The text encoder is converted once to this 4-bit form and kept next to the model as <name>@mlx-te4.
      text_encoder: { bits: 4, group_size: 64, layers: 50 }

# --- Prompt enhancer (local LLM) ---

prompt_enhancer:
  # Public Hugging Face repos, pinned. The model below is the default Fast choice; `smart` holds the larger one.
  # Override both with prompt_enhancer.user_model (REPO[@REVISION] or a folder) (Config page) or
  # --enhance-model REPO[@REVISION].
  model:
    darwin: McG-221/Qwen3.5-4B-heretic-mlx-4Bit
    win32: coder3101/Qwen3.5-4B-heretic
    linux: coder3101/Qwen3.5-4B-heretic
  revision:
    darwin: 7a6b22e4cd458ba20a8c2737634a932f2b572ef2
    win32: dc69b95668662490d2f84db1cf0bb61f8743f806
    linux: dc69b95668662490d2f84db1cf0bb61f8743f806
  download_size_label:
    darwin: 2.4 GB
    win32: 9 GB
    linux: 9 GB
  # The larger model behind the Smart choice (--enhance-model smart). min_memory_gb is the accelerator memory it
  # needs in GiB (VRAM on Windows/Linux, the GPU working set on macOS); with less, Smart is unavailable.
  smart:
    model:
      darwin: TheCluster/Qwen3.5-27B-Heretic-MLX-4bit
      win32: coder3101/Qwen3.5-9B-heretic
      linux: coder3101/Qwen3.5-9B-heretic
    revision:
      darwin: 31502f7f1babc6b6b7c201cdd79a8dbd30bb93a8
      win32: 554c40af4aef30991d9de3f2e692457f49c28691
      linux: 554c40af4aef30991d9de3f2e692457f49c28691
    download_size_label:
      darwin: 16 GB
      win32: 19 GB
      linux: 19 GB
    min_memory_gb:
      darwin: 20
      win32: 9
      linux: 9
  temperature: 0.7
  max_new_tokens: 700
  idle_release_seconds: 120
  length:
    percent: {shorter: 50, same: 100, longer: 200, extra: 300}
    floor_words: {shorter: 12, same: 25, longer: 40, extra: 80}  # same grows short prompts to 25 words; shorter never aims below 12
    max_words: 300

ui:
  startup_view: workspace
  gallery_page_size: 12
  output_dir: null  # unset: <data dir>/outputs, i.e. ~/.ziv/outputs or $ZIV_DATA_DIR/outputs
  default_models:
    image: klein9b
    video: ltx-8
  # Set once the first-run dialog is skipped; a user setting, not part of the writable config contract.
  first_run_skipped: false
  # Set when Show Hugging Face LoRAs is chosen in Discover LoRAs; a user setting, not part of the writable config contract.
  discover_huggingface: false
