  - id: ms-f-very-long-30s
    tags: [audio, script, messy, fit, long]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Our story begins in a small workshop at the edge of town, where a retired clockmaker named Henrik spent his days repairing watches that nobody wanted. People thought him strange, because he refused to throw anything away, and his shelves were crowded with broken springs, tarnished cases and cracked glass. But Henrik believed that everything had a second life waiting in it. One winter, a young woman named Ida brought him a pocket watch that had belonged to her grandfather. It had not run for forty years. Henrik turned it over in his hands, opened the back, and smiled. For three weeks he worked on it every evening, cleaning, oiling, adjusting. When it finally began to tick, Ida cried. Word spread through the town, and soon the workshop was full of visitors with old clocks and older stories. Henrik never charged more than a cup of tea. He used to say that time was the only thing worth fixing, because it was the only thing we all shared.
    settings: {actions: [fit], seconds: 30}
