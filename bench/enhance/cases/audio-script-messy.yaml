  - id: ms-d-very-long
    tags: [audio, script, messy, delivery, long]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Chapter one. The valley had no name until the surveyors came. Before that, it was simply home to the people who lived there, and to the sheep, and to the river that cut through the middle like a silver blade. The surveyors arrived in the spring of that year with their tripods and their long chains, and they stayed for three months. They measured everything. They measured the width of the river and the height of the hills. They counted the houses and the barns and the stones in the walls. When they left, they took with them a map that gave the valley a name, and the villagers, who had never needed one, found that they could not stop saying it. Greenholm, they said. Greenholm this and Greenholm that. By autumn, the children were drawing it on their slates. By winter, the old people were arguing about whether it had always been called that. By the following spring, nobody could remember that it had ever been otherwise. And that, as far as anyone could tell, was how the valley lost its first name and gained its second, without a single shot being fired or a single word of protest being spoken. Chapter two. The first thing the mapmakers noticed was the silence. It was not the silence of an empty place, because the valley was full of small sounds: the bleating of lambs, the clatter of a cart on the stones, the slow tick of the church clock. It was the silence of a place that had decided, a long time ago, to listen rather than to speak. Mara, the youngest of the surveyors, spent her evenings sitting on a wall at the edge of the village, writing in a small notebook. She wrote about the light, which turned the hills gold at six and violet at seven. She wrote about the smell of woodsmoke and wet grass. She wrote about the old woman who sold eggs from a basket and never once asked her name. Years later, when Mara had grown old herself, she took out that notebook and read it aloud to her grandchildren, and they asked her whether the valley was real. She smiled and said that it was as real as anything she had ever measured, and a good deal more beautiful. Chapter three. The winter of that year was the hardest anyone could remember. Snow fell for nine days without stopping, and when it finally ceased, the whole valley lay under a white blanket that muffled every sound. The river froze from bank to bank. The sheep huddled in the lee of the walls. The villagers kept their fires burning day and night, and shared what they had, which was not much. On the tenth morning, a boy named Tomas climbed the hill behind the church and looked out over the valley. He saw the smoke rising from every chimney, thin and straight in the still air, and he understood for the first time that the village was not a place but a promise that people made to one another.
    settings: {actions: [delivery]}
