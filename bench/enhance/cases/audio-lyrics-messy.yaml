# Messy, realistic Lyrics-box contents for the lyrics helper (improve the whole song, improve one section, write one empty section).
# Everything here is original text written for the bench. Run with:
#   python -m bench.enhance run --cases-file bench/enhance/cases/audio-lyrics-messy.yaml --label NAME --model fast|smart
# The cause tags say what makes the input messy: untagged, tagstyle, refusal-open, repeat, quotes, short, long, blanks, language, odd.

cases:
  # ---- whole song: no tags --------------------------------------------------------------------------------------------------------
  - id: ml-untagged-short
    tags: [audio, lyrics, messy, whole, untagged]
    mode: audio-lyrics
    family: yue2
    prompt: |-
      Rain on the window, I'm counting the hours
      You said you'd be here by nine
      The kettle is singing, the cat's on the sofa
      And I keep on checking the time
    settings: {}
  - id: ml-untagged-two-stanzas-tighten
    tags: [audio, lyrics, messy, whole, untagged]
    mode: audio-lyrics
    family: yue2
    prompt: |-
      We drove all night along the coast road with the windows rolled right down
      The radio was playing something old from some forgotten town
      You had your feet up on the dashboard and your hair was in your eyes
      And I was thinking that I never saw a prettier sunrise

      Now the road is long behind us and the summer's turning cold
      I still keep that old cassette tape though the music's getting old
      Sometimes I play it in the evening when the house is dark and still
      And I'm back there on that coast road, and I always will
    settings: {improve: [tighten]}
  - id: ml-untagged-long-rhymes
    tags: [audio, lyrics, messy, whole, untagged, long]
    mode: audio-lyrics
    family: yue2
    prompt: |-
      The baker opens early when the town is fast asleep
      He kneads the dough and hums a tune, the oven's warm and deep
      A woman with a bicycle goes rattling down the lane
      She leaves a basket by the door and then she's gone again

      The schoolkids come at half past eight, they crowd around the glass
      They point at all the sugar buns and push to be first in class
      The old man with the newspaper takes the table by the wall
      He's been here every morning since before the leaves would fall

      By noon the bread is nearly gone, the shelves are looking bare
      The baker wipes his floury hands and sits down in a chair
      He thinks about his father and the shop that he once ran
      And how the smell of rising bread is how the day began
    settings: {improve: [rhymes]}
