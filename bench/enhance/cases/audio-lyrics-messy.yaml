  - id: ml-very-long-tighten
    tags: [audio, lyrics, messy, whole, long]
    mode: audio-lyrics
    family: yue2
    prompt: |-
      [Verse 1]
      I packed my bags in the early light of a Monday morning in June
      Said goodbye to the garden and the cat and the afternoon
      I took the bus to the station where the pigeons gather round
      And I bought a ticket to a place I'd only heard the name of
      I watched the fields go by in rows of yellow and of green
      And I thought about the life I left, the quiet and the clean

      [Chorus]
      Oh, I'm leaving, I'm leaving, I'm leaving for the sea
      There's nothing in this valley that is calling out to me
      Oh, I'm leaving, I'm leaving, I'm leaving all behind
      And the only thing I'm taking is the music in my mind

      [Verse 2]
      The city came in sudden like a wave against the glass
      With all its shouting voices and its crowds that never pass
      I found a little room above a shop that sold old books
      With a window on the rooftops and a stove that never cooks
      I lived on bread and coffee and the kindness of a friend
      And I wrote a hundred letters that I never thought to send

      [Chorus]
      Oh, I'm leaving, I'm leaving, I'm leaving for the sea
      There's nothing in this valley that is calling out to me
      Oh, I'm leaving, I'm leaving, I'm leaving all behind
      And the only thing I'm taking is the music in my mind

      [Verse 3]
      Years went by like pages in a book I couldn't close
      I learned the names of all the streets and where the river goes
      I met a girl who painted and she taught me how to see
      The colours in the shadows of an ordinary tree
      We married in the springtime on a hill above the town
      And we watched the sun go slowly, slowly down

      [Bridge]
      And sometimes in the evening when the lamplight turns to gold
      I think about the valley and the stories I was told
      I think about the garden and the cat that used to wait
      And I wonder if the door is still unlatched upon the gate

      [Chorus]
      Oh, I'm leaving, I'm leaving, I'm leaving for the sea
      There's nothing in this valley that is calling out to me
      Oh, I'm leaving, I'm leaving, I'm leaving all behind
      And the only thing I'm taking is the music in my mind

      [Outro]
      Oh, I'm leaving, I'm leaving
      I'm leaving for the sea
    settings: {improve: [tighten]}
