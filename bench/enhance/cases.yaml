    prompt: *market
    settings: {length: extra}
    context: {ratio: "3:2"}
    keep: *market-keep
  - id: long-extra
    tags: [long, image]
    prompt: >-
      A lone hiker in an orange jacket stands on a rocky ridge above a valley filled with low clouds. Pine trees cling
      to the slopes below, and a narrow trail winds down toward a small lake that reflects the pale morning sky. Far
      away, snow-capped peaks catch the first light, and a hawk circles above the ridge.
    settings: {length: extra}
    context: {ratio: "16:9"}
    keep: [hiker, orange jacket, lake, hawk, trail]

