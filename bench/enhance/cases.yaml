# Prompt-enhancer bench cases. See proposals/archive/prompt-enhancer-v3.md (phase 1) and docs/developer/enhancer-bench.md.
#
# Each case: id, tags, mode (image | video | caption | audio-sound | audio-style | audio-lyrics | audio-script | audio-fill), prompt, scene (video only), settings (as a prompt file's
# enhance: mapping; {} = the defaults), context (ratio, width, height, frames, fps, audio, reference_image, extends,
# previous, extract_from, new_frames, prompt_is_original), family (for the word ceiling), and optional expectations:
# keep (phrases that must survive; words match as stems, "a|b" lists alternatives), count ("three cats"),
# forbid (phrases that must not appear). After editing expectations, `rescore` updates stored runs without a model.
# Seeds come from the case id, so renaming a case changes its seeds.

x-market: &market >-
  A crowded open-air market in a Mediterranean town on a summer morning. Stalls with striped awnings line a narrow
  cobblestone street. A vendor in a white apron arranges ripe tomatoes, lemons and bunches of basil on a wooden table,
  while an elderly woman with a wicker basket inspects a melon. Behind them, laundry hangs from iron balconies, a cat
  sleeps on a sunlit step, and a blue door stands half open. Pigeons gather near a stone fountain in the small square
  at the end of the street.
x-market-keep: &market-keep [vendor, tomatoes, lemons, basil, elderly woman, basket, melon, cat, fountain, blue door]
x-style-subject: &style-subject a woman walking a dog along a river
x-realism-forbid: &realism-forbid [hyperrealistic, 8k, masterpiece, flawless, perfect skin, smooth skin, airbrushed]
x-style-keep: &style-keep [woman|female, dog, river]

cases:
  # --- Short image prompts --------------------------------------------------------------------------------------
  - id: short-default
    tags: [short, image]
    prompt: a fox in snow
    settings: {}
    context: {ratio: "1:1"}
    keep: [fox, snow]
    forbid: [square frame, landscape frame, portrait frame]
  - id: short-longer
    tags: [short, image]
    prompt: a lighthouse at dusk
    settings: {length: longer}
    context: {ratio: "16:9"}
    keep: [lighthouse, dusk]
    forbid: [square frame, landscape frame, portrait frame]
  - id: short-extra
    tags: [short, image]
    prompt: an old man reading
    settings: {length: extra}
    context: {ratio: "2:3"}
    keep: [old man|elderly man, read]
    forbid: [square frame, landscape frame, portrait frame]
  - id: short-shorter-clamped
    tags: [short, image]
    prompt: red bicycle against a wall
    settings: {length: shorter}
    context: {ratio: "1:1"}
    keep: [red bicycle, wall]
    forbid: [square frame, landscape frame, portrait frame]
  - id: short-photo
    tags: [short, image]
    prompt: a bowl of ramen
    settings: {style: photo}
    context: {ratio: "1:1"}
    keep: [ramen, bowl]
    forbid: [square frame, landscape frame, portrait frame]
  - id: short-portrait-frame
    tags: [short, image]
    prompt: a woman in a yellow raincoat
    settings: {details: [subject, lighting]}
    context: {ratio: "9:16"}
    keep: [woman, yellow raincoat]
    forbid: [child, dog, umbrella, square frame, landscape frame, portrait frame]
  - id: short-mood
    tags: [short, image, mood]
    prompt: a quiet harbor
    settings: {mood: melancholic}
    context: {ratio: "16:9"}
    keep: [harbor]
    forbid: [square frame, landscape frame, portrait frame]
  - id: short-direction
    tags: [short, image, direction]
    prompt: a city street
    settings: {note: "at night, in heavy rain"}
    context: {ratio: "16:9"}
    keep: [street, rain, night]
    forbid: [square frame, landscape frame, portrait frame]

  # --- Long image prompts ---------------------------------------------------------------------------------------
  - id: long-same
    tags: [long, image]
