      Marie stands at the window in the rain
      The coffee in her hand has gone cold
      A letter lies unopened on the floor
      She thinks of the harbour long ago

      [Chorus]
      Marie, Marie, wait for the morning
      The light will find you again
    settings: {improve: [rhymes]}
    context: {style: "melancholic indie pop"}
    keep: [Marie, window, rain, harbour]
  - id: yue2-lyrics-simpler
    tags: [audio, lyrics, yue2, improve, simpler]
    mode: audio-lyrics
    family: yue2
    prompt: |-
