  # --- Audio lyrics: a song's lyrics improved as a whole or one section at a time, or one empty section written -----
  # A lyrics case's prompt is the song as the Lyrics box holds it (`[Section]` tags on their own lines), its settings are the
  # lyrics task's (improve: tighten | fit | rhymes | simpler, note, section: the section's index from 0, action: write) and its
  # context takes `style`. The checks are `tags_kept` (the same tags, in order, each on its own line), `scope_kept` (empty sections stay
  # empty, a repeated chorus stays a repeat, a section task changes only its section; a Write fills only its section) and `marks_kept`.
  - id: yue2-lyrics-tighten
    tags: [audio, lyrics, yue2, improve]
    mode: audio-lyrics
    family: yue2
    prompt: |-
      [Verse]
      I was walking down the road that leads me back to where I used to be
      And the streetlights they were flickering, flickering, flickering on me
      I was thinking about all of the things that we said to each other that day

      [Chorus]
      Oh, take me home, take me home, take me home to the place where I belong
      Take me home, take me home, take me home where the river sings its song

      [Verse]
      Now the years have gone and passed me by like leaves upon the autumn wind
      And I wonder if you ever think of me, of where we were and where we've been
    settings: {improve: [tighten]}
    context: {style: "warm acoustic folk, fingerpicked guitar, wistful"}
    keep: [road, streetlights, home, river]
  - id: yue2-lyrics-rhymes
    tags: [audio, lyrics, yue2, improve, rhymes]
    mode: audio-lyrics
    family: yue2
    prompt: |-
