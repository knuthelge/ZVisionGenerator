  # --- Video: extend --------------------------------------------------------------------------------------------
  - id: extend-scene
    tags: [video, extend]
    mode: video
    scene: A cat sits on a kitchen counter next to a bowl of fruit.
    prompt: the cat knocks an apple off the counter
    settings: {}
    context: {ratio: "16:9", frames: 97, new_frames: 72, fps: 24, audio: true, extends: true, previous: the cat stares at the bowl and slowly reaches out a paw}
    keep: [apple]
  - id: extend-no-scene
    tags: [video, extend]
    mode: video
    prompt: ""
    settings: {}
    context:
      ratio: "16:9"
      frames: 97
      new_frames: 72
      fps: 24
      audio: true
      extends: true
      previous: 'A man in a grey suit stands on a train platform, checks his watch and says "Late again."'
