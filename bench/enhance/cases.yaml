  # --- Framing: shot and angle ----------------------------------------------------------------------------------
  # The person rows cover every angle; the motorcycle rows repeat the hard ones on an object. The "bare" rows put the
  # angle's name in the prompt with no option, so their "Your prompt" picture shows what the keyword alone does.
  - {id: angle-eye-level, tags: [framing, angle, image], prompt: &angle-woman a woman in a green coat standing on a city sidewalk, settings: {angle: eye-level}, context: {ratio: "2:3"}, keep: [woman, coat, sidewalk|street]}
  - {id: angle-high, tags: [framing, angle, image], prompt: *angle-woman, settings: {angle: high}, context: {ratio: "2:3"}, keep: [woman, coat, "above|high angle|looking down"]}
  - {id: angle-low, tags: [framing, angle, image], prompt: *angle-woman, settings: {angle: low}, context: {ratio: "2:3"}, keep: [woman, coat, "low angle|below|looking up"]}
  - {id: angle-overhead, tags: [framing, angle, image], prompt: *angle-woman, settings: {angle: overhead}, context: {ratio: "2:3"}, keep: [woman, coat, "overhead|top-down|directly above"]}
  - {id: angle-worms-eye, tags: [framing, angle, image], prompt: *angle-woman, settings: {angle: worms-eye}, context: {ratio: "2:3"}, keep: [woman, coat, "worm|ground|looking up"]}
  - {id: angle-dutch, tags: [framing, angle, image], prompt: *angle-woman, settings: {angle: dutch}, context: {ratio: "2:3"}, keep: [woman, coat, "tilt|dutch|diagonal"]}
  - {id: angle-over-shoulder, tags: [framing, angle, image], prompt: *angle-woman, settings: {angle: over-shoulder}, context: {ratio: "2:3"}, keep: [woman, coat, shoulder]}
  - {id: angle-behind, tags: [framing, angle, image], prompt: *angle-woman, settings: {angle: behind}, context: {ratio: "2:3"}, keep: [woman, coat, "behind|back|away"]}
  - {id: angle-moto-low, tags: [framing, angle, image], prompt: &angle-moto a vintage motorcycle parked by a brick wall, settings: {angle: low}, context: {ratio: "3:2"}, keep: [motorcycle, brick wall]}
  - {id: angle-moto-high, tags: [framing, angle, image], prompt: *angle-moto, settings: {angle: high}, context: {ratio: "3:2"}, keep: [motorcycle, brick wall]}
  - {id: angle-moto-worms-eye, tags: [framing, angle, image], prompt: *angle-moto, settings: {angle: worms-eye}, context: {ratio: "3:2"}, keep: [motorcycle, brick wall]}
