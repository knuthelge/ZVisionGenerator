  # --- Audio script: a speech text marked up with delivery, or fitted to a reading time -----------------------------
  # A script case's prompt is the Text box (with its `[marks]`), its settings are the script task's (`actions: [delivery]`, `actions: [fit]`
  # with `seconds` and an optional `pace`, or both), and it takes no context. The checks are `words_kept` (Add delivery changed no word),
  # `marks_known` (only marks the app knows), `fit_in_range` (a Fit reads within 15% of its time by the app's reading rate; `length_ratio`
  # is the share of the target) and `quotes_kept`. `keep` and `forbid` work as for the other cases.
  - id: qwen3-script-delivery-sad-story
    tags: [audio, script, qwen3, delivery]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      My grandfather kept a small boat in the harbour for forty years. Every Sunday he rowed out alone and never said where he went. When he died, we found the boat empty except for a single letter. It was addressed to my grandmother, who had left us long before. We read it together, and for the first time in years, we laughed.
    settings: {actions: [delivery]}
    keep: [grandfather, boat, harbour, letter, grandmother]
  - id: qwen3-script-delivery-announcement
    tags: [audio, script, qwen3, delivery]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Ladies and gentlemen, welcome to the final night of the Summer Lights Festival! Tonight we have fireworks over the lake, a live band on the main stage, and free ice cream for every child under twelve. The gates close at midnight, so make the most of it. Thank you for being here, and enjoy the show!
    settings: {actions: [delivery]}
    keep: [Summer Lights Festival, fireworks, ice cream, midnight]
  - id: qwen3-script-delivery-secret
    tags: [audio, script, qwen3, delivery]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Come closer. I have to tell you something, and nobody else can hear it. The key is not under the mat. It never was. It is inside the old clock in the hall, behind the little door at the back. Do not tell Marta.
    settings: {actions: [delivery]}
    keep: [key, clock, Marta]
  - id: qwen3-script-delivery-existing-marks
    tags: [audio, script, qwen3, delivery, marks]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      [sad] The house was quiet after the funeral. … Nobody wanted to be the first to speak. [as set] Then Lena put the kettle on, and slowly the kitchen filled with voices again. We told stories until the sun went down.
    settings: {actions: [delivery]}
    keep: [Lena, kettle, kitchen]
  - id: qwen3-script-delivery-names-quotes
    tags: [audio, script, qwen3, delivery, names, quotes]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Dr. Okafor looked at the results for a long time. Then she turned to Piotr and said "The scan is clear." He could not believe it. They had waited eleven weeks for those words, in a hospital in Gdansk where every corridor smelled of coffee and fear.
    settings: {actions: [delivery]}
    keep: [Okafor, Piotr, Gdansk, eleven weeks]
  - id: qwen3-script-delivery-plain
    tags: [audio, script, qwen3, delivery, neutral]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      To reset the router, unplug it from the wall and wait thirty seconds. Plug it back in and wait until the green light stays on. This usually takes about two minutes. If the light stays red, contact your provider.
    settings: {actions: [delivery]}
    keep: [router, thirty seconds, green light, provider]
  - id: qwen3-script-fit-shorten
    tags: [audio, script, qwen3, fit]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Our company was founded in 1998 in a small garage in Portland by two friends who loved bicycles. At first we only repaired old frames and sold used parts to neighbours. Slowly, word spread, and customers began to ask for new bikes built to their own measurements. By 2005 we had moved into a real workshop with six employees. Today we ship custom bicycles to more than forty countries, and every frame is still welded by hand. We believe that a bicycle should fit its rider like a good pair of shoes, and that belief has guided every decision we have made, from the first frame to the ten thousandth.
    settings: {actions: [fit], seconds: 25}
    keep: [1998, Portland, bicycle, forty countries]
  - id: qwen3-script-fit-shorten-slow
    tags: [audio, script, qwen3, fit, pace]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Good evening, and welcome to tonight's guided meditation. Find a comfortable position, either sitting or lying down, and let your hands rest loosely at your sides. Close your eyes if that feels right for you. Take a slow breath in through your nose, hold it gently for a moment, and release it through your mouth. Notice how your body feels against the surface beneath you. With every breath out, allow your shoulders to drop a little further, and let any tension in your jaw melt away.
    settings: {actions: [fit], seconds: 30, pace: slow}
    keep: [breath, shoulders]
  - id: qwen3-script-fit-lengthen
    tags: [audio, script, qwen3, fit, lengthen]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Welcome to the Riverside Library. We have books, computers and a quiet reading room. The library is open every day.
    settings: {actions: [fit], seconds: 14}
    keep: [Riverside Library, books, computers, reading room]
  - id: qwen3-script-fit-marks
    tags: [audio, script, qwen3, fit, marks]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      [thoughtful] I have been thinking about the old orchard behind our house. It had forty apple trees when my father planted it, and a low stone wall that he built himself, one stone at a time. [sad] Last winter a storm took half of the trees. … [determined] This spring we are planting them again. Each tree will carry a small brass tag with the name of someone we love, so that the orchard will remember them long after we are gone.
    settings: {actions: [fit], seconds: 20}
    keep: [orchard, apple, father, brass]
  - id: qwen3-script-fit-names-quotes
    tags: [audio, script, qwen3, fit, names, quotes]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      The mayor of Linz, Katharina Brandt, opened the new bridge on Saturday morning. In front of a crowd of nearly two thousand people she said "This bridge belongs to everyone who walks, cycles or rides across it." The bridge cost forty million euros, took three years to build, and connects the old town with the new harbour district for the first time since the war.
    settings: {actions: [fit], seconds: 18}
    keep: [Linz, Katharina Brandt, bridge]
  - id: qwen3-script-fit-fast
    tags: [audio, script, qwen3, fit, pace]
    mode: audio-script
    family: qwen3_tts
    prompt: |-
      Thanks for calling Northside Dental. Our office is open Monday through Friday from eight in the morning until five in the afternoon, and on Saturdays from nine until noon. If this is a dental emergency, please press one now to reach our on-call dentist. To book an appointment, press two. To speak with our billing team about an invoice or insurance claim, press three. For directions to our clinic, press four. To hear these options again, stay on the line.
    settings: {actions: [fit], seconds: 20, pace: fast}
    keep: [Northside Dental, emergency, appointment]

  # --- Audio fill: the fields still empty written from a Describe it idea, in one answer -----------------------------
  # A fill case's prompt is the Describe it text and its settings are `fields` (what is still empty: style, tempo, key, lyrics for music;
  # vibe, text for speech); the kind follows the fields. Its context takes what the user already set (style, lyrics, text, tempo, key), which
  # the answer must not write again. The checks are `fields_filled` (the share of the asked fields written; an instrumental, tagged `instrumental`,
  # is filled by `LYRICS: none`), `only_empty` (the first answer wrote only the asked fields), `values_valid` (the first answer's Tempo, Key
  # and Vibe were in range, one of the 24 and one the app serves), `fill_tags` (the first answer's lyrics put every section tag alone on its
  # line) and `banned` on the Style; `keep` checks that names from the idea survive and `quotes_kept` quoted words.
