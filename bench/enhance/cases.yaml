  - {id: style-gouache, tags: [style, image, new-style], prompt: *style-subject, settings: {style: gouache}, context: {ratio: "3:2"}, keep: *style-keep}
  - {id: style-sketch, tags: [style, image, new-style], prompt: *style-subject, settings: {style: sketch}, context: {ratio: "3:2"}, keep: *style-keep}
