    keep: [man]
  - id: extend-continue
    tags: [video, extend]
    mode: video
    scene: A sandy beach at sunset with gentle waves.
    prompt: ""
    settings: {}
    context: {ratio: "16:9", frames: 97, new_frames: 72, fps: 24, audio: false, extends: true, previous: a dog runs along the waterline chasing a ball}

