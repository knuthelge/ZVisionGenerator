version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: main
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      major-releases:
        update-types:
          - major

  # No version updates for Python deps; only bundle security fixes into one PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
