name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write

jobs:
  # Resolve the built wheel from an empty directory, as `uv tool install` does for a user, before anything is published.
  wheel-resolves:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Check the wheel resolves on Linux, Windows and macOS
        run: scripts/check_wheel_resolves.sh

  publish:
    needs: wheel-resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: pnpm/action-setup@v6
        with:
          version: "11.28.8"
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Validate packaged Web UI
        run: make frontend-static-check

      - name: Build package
        run: make build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # PEP 440 pre-release tags (v0.13.0a1, v0.13.0b1, v0.13.0rc1) become GitHub pre-releases, never "Latest".
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: dist/*
