[package]
name = "zvision-launcher"
version = "0.1.0"
description = "Installs, starts, updates and removes Z-Vision Generator without a terminal"
license = "AGPL-3.0-or-later"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "~2.7.0"
tauri-plugin-single-instance = "~2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
sha2 = "0.11.1"
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.11"
lzma-rs = "0.3.0"
dirs = "7.0.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
open = "5.4.5"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
