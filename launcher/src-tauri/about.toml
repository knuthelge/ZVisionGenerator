# Settings for `cargo about` (see `make launcher-licenses`). Only crates compiled into a release build for the
# three installer targets count; the launcher itself is ours and is not listed.
accepted = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
