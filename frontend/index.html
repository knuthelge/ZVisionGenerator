<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the bars run under a phone's notch and home indicator (they pad for the insets);
         interactive-widget=resizes-content shrinks the page for the keyboard instead of covering the prompt. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0c0d" />
    <!-- Added to a home screen, the app opens without the browser chrome; no service worker, so nothing is cached. -->
    <link rel="manifest" href="/app-static/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ziv" />
    <link rel="icon" type="image/svg+xml" href="/app-static/ziv-icon.svg" />
    <link rel="icon" type="image/png" href="/app-static/ziv-icon.png" />
    <link rel="apple-touch-icon" href="/app-static/ziv-icon.png" />
    <!-- Nunito from Google Fonts, loaded without blocking render: the app paints with the
         system-font fallbacks in global.css and swaps Nunito in if and when it arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800&display=swap" /></noscript>
    <title>ZVision Generator</title>
  </head>
  <body class="bg-bg-base text-text-primary font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
