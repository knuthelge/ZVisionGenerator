[project]
name = "z-vision-generator"
dynamic = ["version"]
description = "Z-Vision Generator — cross-platform AI image and video generator"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Knut Risheim" }]
keywords = ["ai", "image-generation", "video-generation", "z-image", "flux", "mlx", "diffusers", "stable-diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.15.0",
    "av>=19.0.1; sys_platform != 'darwin'",
    "bitsandbytes>=0.50.0; sys_platform != 'darwin'",
    "diffusers==0.41.0",
    "einops>=0.8.0; sys_platform != 'darwin'",
    "fastapi>=0.143.0",
    "huggingface-hub>=1.33.0,<2.0",
    "mflux>=0.22.0,<0.23; sys_platform == 'darwin'",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0; sys_platform != 'darwin'",
    "opencv-python-headless>=4.10.0; sys_platform != 'darwin'",
    "peft>=0.21.2; sys_platform != 'darwin'",
    "Pillow>=12.3.0,<13",
    "python-multipart>=0.0.32",
    "psutil>=5.9.0",
    "pyyaml>=6.0.3",
    "rotary-embedding-torch>=0.5.3; sys_platform != 'darwin'",
    "scipy>=1.17.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0; sys_platform != 'darwin'",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
    "mlx>=0.32.2; sys_platform == 'darwin'",
    "mlx-arsenal>=0.2.4,<0.3; sys_platform == 'darwin'",
    "mlx-lm>=0.32.0; sys_platform == 'darwin'",
    "safetensors>=0.8.0",
    "tqdm>=4.66.0",
    "ruamel-yaml>=0.18.10",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 200
exclude = ["zvisiongenerator/_version.py", "packages"]

[tool.ruff.lint]
# Pin the rule set rather than follow Ruff's default.
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.6",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/knuthelge/ZVisionGenerator"
Repository = "https://github.com/knuthelge/ZVisionGenerator"
Documentation = "https://knuthelge.github.io/ZVisionGenerator/"
Changelog = "https://github.com/knuthelge/ZVisionGenerator/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/knuthelge/ZVisionGenerator/issues"

[project.scripts]
ziv = "zvisiongenerator.cli:main"
ziv-ui = "zvisiongenerator.web:main"
ziv-image = "zvisiongenerator.image_cli:main"
ziv-video = "zvisiongenerator.video_cli:main"
ziv-model = "zvisiongenerator.converters.convert_checkpoint:main"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }

[tool.hatch.build.hooks.vcs]
version-file = "zvisiongenerator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["zvisiongenerator", "packages/ltx_core_mlx", "packages/ltx_pipelines_mlx", "packages/seedvr2_torch"]

[tool.hatch.build.targets.wheel.force-include]
"zvisiongenerator/config.yaml" = "zvisiongenerator/config.yaml"
